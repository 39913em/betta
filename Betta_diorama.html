<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Betta</title>
<style>
  html,body{margin:0;padding:0;background:#020503;width:100%;height:100%;overflow:hidden;cursor:crosshair}
  canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
let W,H,dpr;

const CFG = {
  ARTEMIA_TO_NEST: 500,
  ARTEMIA_TO_GROW: 500,
  ARTEMIA_MAX: 42,
  ARTEMIA_SPAWN_DT: 0.7,
  HATCH_DELAY: 10,
  NEST_BUBBLES: 40,
  NEST_BUILD_DT: 0.35,
};

// ===== PLANOS: banda de nado del pez (plano 2) =====
const SWIM_BAND = { topFrac: 0.10, botFrac: 0.72 };
const MAX_BETTAS = 5;
const BIRTH_VARIANTS = ['original','superDelta','halfmoon','roseTail','crowntail'];
let reproductionComplete = false;
let createdBettas = 1;
let grownBettas = 1;

function resize(){
  dpr=Math.min(devicePixelRatio||1,1.8);
  W=canvas.width=innerWidth*dpr;
  H=canvas.height=innerHeight*dpr;
  canvas.style.width=innerWidth+'px';
  canvas.style.height=innerHeight+'px';
  buildSwamp();
}

/* ============================================================
   AUDIO
   ============================================================ */
let actx,master,started=false,analyser,micData,micActive=false;
async function initAudio(){
  if(started) return; started=true;
  try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  master=actx.createGain(); master.gain.value=0; master.connect(actx.destination);
  const o1=actx.createOscillator(); o1.type='sine'; o1.frequency.value=36;
  const o2=actx.createOscillator(); o2.type='sine'; o2.frequency.value=54;
  const og=actx.createGain(); og.gain.value=0.09;
  o1.connect(og); o2.connect(og); og.connect(master); o1.start(); o2.start();
  master.gain.linearRampToValueAtTime(0, actx.currentTime);
  master.gain.linearRampToValueAtTime(0.4, actx.currentTime+4);
  try{
    const s=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    const src=actx.createMediaStreamSource(s);
    analyser=actx.createAnalyser(); analyser.fftSize=1024; analyser.smoothingTimeConstant=0.7;
    src.connect(analyser);
    const sil=actx.createGain(); sil.gain.value=0;
    analyser.connect(sil); sil.connect(actx.destination);
    micData=new Uint8Array(analyser.frequencyBinCount);
    micActive=true;
  }catch(e){}
}
function readMic(){
  if(!micActive)return;
  analyser.getByteFrequencyData(micData);
  const N=micData.length;
  let total=0,bass=0,mid=0,high=0;
  for(let i=1;i<N;i++){
    const v=micData[i]/255;
    total+=v;
    if(i<N*.12)bass+=v;
    else if(i<N*.45)mid+=v;
    else high+=v;
  }
  let e=(total/(N-1));
  e=Math.max(0,e-.022)*1.55;
  const a=.50,r=.12;
  for(const f of allBettas()){
    if(e>f.micLevel)f.micLevel+=(e-f.micLevel)*a;
    else f.micLevel+=(e-f.micLevel)*r;
    const d=e-f.micPrev;f.micPrev=e;f.micDeriv=f.micDeriv*.70+Math.max(0,d)*.30;
    f.micBass=(f.micBass||0)*.8+(bass/Math.max(1,N*.12))*.2;
    f.micMid=(f.micMid||0)*.8+(mid/Math.max(1,N*.33))*.2;
    f.micHigh=(f.micHigh||0)*.8+(high/Math.max(1,N*.55))*.2;
  }
}
function bubbleSnd(i=1,p=1){
  if(!actx) return;
  const n=actx.currentTime;
  const o=actx.createOscillator(); o.type='sine';
  o.frequency.setValueAtTime(190*p,n);
  o.frequency.exponentialRampToValueAtTime(40*p,n+0.32*i);
  const g=actx.createGain();
  g.gain.setValueAtTime(0,n);
  g.gain.linearRampToValueAtTime(0.20*i,n+0.02);
  g.gain.exponentialRampToValueAtTime(0.001,n+0.55*i);
  const bp=actx.createBiquadFilter(); bp.type='bandpass';
  bp.frequency.value=900*p; bp.Q.value=7;
  o.connect(bp); bp.connect(g); g.connect(master);
  o.start(n); o.stop(n+0.75);
}
function bubblePop(){
  if(!actx) return;
  const n=actx.currentTime;
  const o=actx.createOscillator(); o.type='sine';
  o.frequency.setValueAtTime(600+Math.random()*300,n);
  o.frequency.exponentialRampToValueAtTime(1200,n+0.05);
  const g=actx.createGain();
  g.gain.setValueAtTime(0.08,n);
  g.gain.exponentialRampToValueAtTime(0.001,n+0.08);
  o.connect(g); g.connect(master);
  o.start(n); o.stop(n+0.1);
}

/* ============================================================
   SWAMP
   ============================================================ */
let swampCanvas, plants=[], plantsFg=[], motes=[];
function buildSwamp(){
  swampCanvas=document.createElement('canvas');
  swampCanvas.width=W; swampCanvas.height=H;
  const c=swampCanvas.getContext('2d');

  /* ==========================================================
     5 PLANOS VISUALES
     5 = agua / fondo
     4 = madera y vegetación lejana
     3 = peces lejanos + plantas medias
     2 = peces medios + vegetación central
     1 = peces cercanos + alfombra frontal
     ========================================================== */

  const water=c.createLinearGradient(0,0,0,H);
  water.addColorStop(0,'#c8d0c9');
  water.addColorStop(0.08,'#83968d');
  water.addColorStop(0.30,'#4b6659');
  water.addColorStop(0.62,'#233c2f');
  water.addColorStop(0.86,'#14251c');
  water.addColorStop(1,'#0a120d');
  c.fillStyle=water;
  c.fillRect(0,0,W,H);

  /* fondo difuso, sin rayos de luz */
  const haze=c.createLinearGradient(0,0,0,H*0.55);
  haze.addColorStop(0,'rgba(240,245,238,0.22)');
  haze.addColorStop(0.35,'rgba(180,205,190,0.08)');
  haze.addColorStop(1,'rgba(20,35,25,0)');
  c.fillStyle=haze;
  c.fillRect(0,0,W,H*0.65);

  /* Plano 4: masas vegetales lejanas */
  for(let i=0;i<26;i++){
    const x=W*(0.02+Math.random()*0.96);
    const base=H*(0.73+Math.random()*0.18);
    const h=H*(0.16+Math.random()*0.32);
    const col=i<14?'rgba(33,68,48,0.46)':'rgba(52,87,58,0.30)';
    c.strokeStyle=col;
    c.lineWidth=(2+Math.random()*4)*dpr;
    c.lineCap='round';
    c.beginPath();
    c.moveTo(x,base);
    c.quadraticCurveTo(
      x+(Math.random()-0.5)*45*dpr,
      base-h*0.45,
      x+(Math.random()-0.5)*70*dpr,
      base-h
    );
    c.stroke();
  }

  /* ==========================================================
     MADERA CENTRAL — estructura orgánica inspirada en la foto
     ========================================================== */
  function branch(points,width,depth,seed){
    c.save();
    c.lineCap='round';
    c.lineJoin='round';

    const grad=c.createLinearGradient(0,0,W,H);
    grad.addColorStop(0,'#49351e');
    grad.addColorStop(0.28,'#302313');
    grad.addColorStop(0.62,'#1d160d');
    grad.addColorStop(1,'#090804');

    c.strokeStyle=grad;
    c.lineWidth=width*dpr;
    c.beginPath();
    c.moveTo(points[0][0],points[0][1]);
    for(let i=1;i<points.length-1;i++){
      const p=points[i], n=points[i+1];
      const mx=(p[0]+n[0])/2, my=(p[1]+n[1])/2;
      c.quadraticCurveTo(p[0],p[1],mx,my);
    }
    const last=points[points.length-1];
    c.lineTo(last[0],last[1]);
    c.stroke();

    /* irregular bark fibers */
    const minX=Math.min(...points.map(p=>p[0])), maxX=Math.max(...points.map(p=>p[0]));
    const minY=Math.min(...points.map(p=>p[1])), maxY=Math.max(...points.map(p=>p[1]));
    const count=Math.max(8,Math.floor((maxX-minX+maxY-minY)/35));
    for(let i=0;i<count;i++){
      const p=points[Math.floor(Math.random()*points.length)];
      const a=(Math.random()-0.5)*1.5;
      c.strokeStyle=`rgba(${75+Math.random()*35|0},${55+Math.random()*28|0},${28+Math.random()*18|0},${0.22+Math.random()*0.30})`;
      c.lineWidth=(0.35+Math.random()*0.8)*dpr;
      c.beginPath();
      c.moveTo(p[0]-Math.cos(a)*12*dpr,p[1]-Math.sin(a)*12*dpr);
      c.quadraticCurveTo(p[0],p[1],p[0]+Math.cos(a)*14*dpr,p[1]+Math.sin(a)*14*dpr);
      c.stroke();
    }
    c.restore();
  }

  const trunkX=W*0.50;
  branch([
    [W*0.48,H*0.91],[W*0.49,H*0.75],[W*0.46,H*0.61],[W*0.43,H*0.48],
    [W*0.31,H*0.38],[W*0.16,H*0.31],[W*0.04,H*0.38]
  ],31,4,1);
  branch([
    [W*0.49,H*0.76],[W*0.57,H*0.60],[W*0.66,H*0.50],[W*0.73,H*0.36],
    [W*0.78,H*0.20]
  ],25,4,2);
  branch([
    [W*0.46,H*0.60],[W*0.39,H*0.48],[W*0.33,H*0.28],[W*0.27,H*0.11],
    [W*0.22,H*0.02]
  ],21,4,3);
  branch([
    [W*0.54,H*0.63],[W*0.60,H*0.48],[W*0.66,H*0.27],[W*0.62,H*0.10],
    [W*0.58,H*0.01]
  ],19,4,4);
  branch([
    [W*0.48,H*0.80],[W*0.38,H*0.73],[W*0.27,H*0.68],[W*0.15,H*0.69],
    [W*0.07,H*0.76]
  ],17,3,5);
  branch([
    [W*0.53,H*0.78],[W*0.65,H*0.77],[W*0.77,H*0.80],[W*0.90,H*0.83]
  ],15,3,6);

  /* roots visible over substrate */
  branch([
    [W*0.50,H*0.82],[W*0.44,H*0.86],[W*0.36,H*0.91],[W*0.26,H*0.94]
  ],11,2,7);
  branch([
    [W*0.54,H*0.82],[W*0.62,H*0.88],[W*0.73,H*0.91],[W*0.84,H*0.94]
  ],10,2,8);

  /* dark underside of wood */
  const shadow=c.createRadialGradient(W*0.50,H*0.72,5,W*0.50,H*0.72,W*0.32);
  shadow.addColorStop(0,'rgba(0,0,0,0.38)');
  shadow.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle=shadow;
  c.fillRect(0,0,W,H);

  /* substrate */
  const floorY=H*0.91;
  const sg=c.createLinearGradient(0,floorY-25*dpr,0,H);
  sg.addColorStop(0,'#344127');
  sg.addColorStop(0.25,'#252c19');
  sg.addColorStop(1,'#090b06');
  c.fillStyle=sg;
  c.fillRect(0,floorY-25*dpr,W,H-floorY+25*dpr);

  for(let i=0;i<950;i++){
    const x=Math.random()*W;
    const y=floorY-4*dpr+Math.random()*(H-floorY+8*dpr);
    const r=(0.35+Math.random()*2.2)*dpr;
    c.fillStyle=`rgba(${25+Math.random()*45|0},${27+Math.random()*38|0},${13+Math.random()*20|0},${0.35+Math.random()*0.5})`;
    c.beginPath(); c.arc(x,y,r,0,Math.PI*2); c.fill();
  }

  /* foreground carpet base — plano 1 */
  c.fillStyle='rgba(65,91,38,0.72)';
  c.beginPath();
  c.moveTo(0,floorY-3*dpr);
  for(let i=0;i<=30;i++){
    const x=W*i/30;
    const y=floorY-(5+Math.random()*14)*dpr;
    c.lineTo(x,y);
  }
  c.lineTo(W,H); c.lineTo(0,H); c.closePath(); c.fill();

  for(let i=0;i<240;i++){
    const x=Math.random()*W;
    const y=floorY-(2+Math.random()*35)*dpr;
    const h=(8+Math.random()*34)*dpr;
    c.strokeStyle=`rgba(${45+Math.random()*45|0},${82+Math.random()*70|0},${25+Math.random()*35|0},${0.45+Math.random()*0.45})`;
    c.lineWidth=(0.7+Math.random()*2.1)*dpr;
    c.beginPath(); c.moveTo(x,y); c.quadraticCurveTo(x+(Math.random()-0.5)*8*dpr,y-h*.55,x+(Math.random()-0.5)*12*dpr,y-h); c.stroke();
  }

  /* Right-side dense tall vegetation, as in reference */
  for(let i=0;i<95;i++){
    const x=W*(0.60+Math.random()*0.39);
    const base=H*(0.90+Math.random()*0.07);
    const h=H*(0.12+Math.random()*0.34);
    const sway=(Math.random()-0.5)*24*dpr;
    c.strokeStyle=`rgba(${45+Math.random()*45|0},${92+Math.random()*85|0},${35+Math.random()*45|0},${0.48+Math.random()*0.42})`;
    c.lineWidth=(1+Math.random()*2.8)*dpr;
    c.lineCap='round';
    c.beginPath(); c.moveTo(x,base); c.quadraticCurveTo(x+sway*.3,base-h*.55,x+sway,base-h); c.stroke();
  }

  /* broad-leaf cluster around the central trunk */
  for(let i=0;i<75;i++){
    const x=W*(0.37+Math.random()*0.25);
    const y=H*(0.34+Math.random()*0.38);
    const rx=(4+Math.random()*9)*dpr;
    const ry=(2+Math.random()*6)*dpr;
    c.save(); c.translate(x,y); c.rotate((Math.random()-0.5)*1.5);
    c.fillStyle=`rgba(${50+Math.random()*55|0},${100+Math.random()*95|0},${35+Math.random()*45|0},${0.45+Math.random()*0.45})`;
    c.beginPath(); c.ellipse(0,0,rx,ry,0,0,Math.PI*2); c.fill();
    c.restore();
  }

  /* glass edge / waterline */
  c.fillStyle='rgba(235,242,235,0.15)';
  c.fillRect(0,0,W,2*dpr);

  /* very subtle vignette, no light effects */
  const vig=c.createRadialGradient(W*.5,H*.55,W*.12,W*.5,H*.55,W*.85);
  vig.addColorStop(0,'rgba(0,0,0,0)');
  vig.addColorStop(0.72,'rgba(0,0,0,0.12)');
  vig.addColorStop(1,'rgba(0,0,0,0.48)');
  c.fillStyle=vig; c.fillRect(0,0,W,H);

  /* plants used by animated layers */
  plants=[];
  for(let i=0;i<20;i++){
    const cx=W*(0.02+i*0.051)+(Math.random()-0.5)*35*dpr;
    const baseY=H*(0.91+Math.random()*0.03);
    const blades=[];
    const bn=5+Math.floor(Math.random()*5);
    for(let b=0;b<bn;b++){
      blades.push({
        ox:(Math.random()-0.5)*32*dpr,
        height:(55+Math.random()*180)*dpr,
        phase:Math.random()*Math.PI*2,
        sway:5+Math.random()*10,
        width:(0.9+Math.random()*2.2)*dpr,
        hue:95+Math.random()*35,
        sat:28+Math.random()*28,
        lig:18+Math.random()*22
      });
    }
    plants.push({x:cx,y:baseY,blades});
  }

  plantsFg=[];
  for(let i=0;i<11;i++){
    const cx=W*(i/10)+(Math.random()-0.5)*35*dpr;
    const baseY=H*(0.99+Math.random()*0.03);
    const blades=[];
    const bn=5+Math.floor(Math.random()*4);
    for(let b=0;b<bn;b++){
      blades.push({
        ox:(Math.random()-0.5)*42*dpr,
        height:(80+Math.random()*170)*dpr,
        phase:Math.random()*Math.PI*2,
        sway:8+Math.random()*13,
        width:(1.5+Math.random()*3.2)*dpr,
        hue:100+Math.random()*32,
        sat:34+Math.random()*26,
        lig:9+Math.random()*12
      });
    }
    plantsFg.push({x:cx,y:baseY,blades});
  }

  motes=[];
  for(let i=0;i<150;i++){
    motes.push({x:Math.random()*W,y:Math.random()*H,r:(.35+Math.random()*1.1)*dpr,vx:(Math.random()-.5)*.04,vy:.008+Math.random()*.035,o:.08+Math.random()*.18,green:Math.random()>.45});
  }
}
function drawPlants(t){ drawPlantsSet(t, plants, 0.8); }
function drawPlantsSet(t, set, alphaMul){
  alphaMul = (alphaMul==null) ? 1 : alphaMul;
  for(const cl of set){
    for(const bl of cl.blades){
      const sway=Math.sin(t*0.6+bl.phase)*bl.sway*dpr;
      const tipX=cl.x+bl.ox+sway, tipY=cl.y-bl.height;
      const midX=cl.x+bl.ox+sway*0.35, midY=cl.y-bl.height*0.55;
      const g=ctx.createLinearGradient(cl.x, cl.y, tipX, tipY);
      g.addColorStop(0,`hsla(${bl.hue},${bl.sat}%,${bl.lig}%,${0.35*alphaMul})`);
      g.addColorStop(0.6,`hsla(${bl.hue},${bl.sat}%,${bl.lig+8}%,${0.55*alphaMul})`);
      g.addColorStop(1,`hsla(${bl.hue},${bl.sat+10}%,${bl.lig+22}%,${0.85*alphaMul})`);
      ctx.strokeStyle=g; ctx.lineWidth=bl.width; ctx.lineCap='round';
      ctx.beginPath();
      ctx.moveTo(cl.x+bl.ox,cl.y);
      ctx.quadraticCurveTo(midX,midY,tipX,tipY);
      ctx.stroke();
    }
  }
}
function drawMotes(dt){
  for(const p of motes){
    p.x+=p.vx; p.y+=p.vy;
    if(p.y>H){ p.y=-5; p.x=Math.random()*W; }
    if(p.x<0) p.x=W; if(p.x>W) p.x=0;
    ctx.globalAlpha=p.o;
    ctx.fillStyle = p.green ? 'rgba(140,180,120,0.7)' : 'rgba(90,70,40,0.6)';
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
}
/* ============================================================
   SPINE
   ============================================================ */
class Spine{
  constructor(len,n){
    this.len=len; this.n=n;
    this.pts=[];
    for(let i=0;i<n;i++) this.pts.push({x:0,y:0,a:0});
  }
  update(x,y,headAngle,wave,time,curvFn){
    const seg=this.len/(this.n-1);
    this.pts[0].x=x; this.pts[0].y=y; this.pts[0].a=headAngle;
    for(let i=1;i<this.n;i++){
      const s=i/(this.n-1);
      const env=0.02+0.98*Math.pow(s,2.0);
      let k=wave.amp*env*Math.sin(2*Math.PI*(wave.freq*time - s*wave.wavelength));
      if(curvFn) k+=curvFn(s,time);
      this.pts[i].a=this.pts[i-1].a+k;
      this.pts[i].x=this.pts[i-1].x-Math.cos(this.pts[i-1].a)*seg;
      this.pts[i].y=this.pts[i-1].y-Math.sin(this.pts[i-1].a)*seg;
    }
  }
}

/* ============================================================
   RAY FIN
   ============================================================ */
class RayFin{
  constructor(nRays,nSegs,len,fanAngle){
    this.nRays=nRays; this.nSegs=nSegs;
    this.baseLen=len; this.baseFan=fanAngle;
    this.rays=[];
    for(let r=0;r<nRays;r++){
      const s=[];
      for(let k=0;k<nSegs;k++) s.push({x:0,y:0,vx:0,vy:0});
      this.rays.push(s);
    }
    this.ext=0.4; this.extV=0;
    this.init=false;
    this.lenScale=1.0; this.fanScale=1.0;
  }
  update(baseX,baseY,baseAngle,flow,opts){
    const k=6.0,damp=3.0;
    this.extV+=(opts.targetExt-this.ext)*k*opts.dt;
    this.extV*=Math.exp(-damp*opts.dt);
    this.ext+=this.extV*opts.dt;
    this.ext=Math.max(0,Math.min(1,this.ext));
    const fanNow=this.baseFan*this.fanScale*(0.10+0.90*this.ext);
    const lenNow=this.baseLen*this.lenScale*(0.35+0.65*this.ext);
    const segLen=lenNow/(this.nSegs-1);
    const tension=0.28+0.55*this.ext;
    const dragK=opts.dragK;
    for(let r=0;r<this.nRays;r++){
      const ray=this.rays[r];
      const fanT=this.nRays>1?(r/(this.nRays-1)-0.5):0;
      const rayAng=baseAngle+fanT*fanNow;
      const bx=baseX+Math.cos(baseAngle+Math.PI/2)*fanT*this.baseFan*6*dpr*opts.spread;
      const by=baseY+Math.sin(baseAngle+Math.PI/2)*fanT*this.baseFan*6*dpr*opts.spread;
      ray[0].x=bx; ray[0].y=by; ray[0].vx=0; ray[0].vy=0;
      if(!this.init){
        for(let s=0;s<this.nSegs;s++){
          ray[s].x=bx+Math.cos(rayAng)*segLen*s;
          ray[s].y=by+Math.sin(rayAng)*segLen*s;
        }
      }
      for(let s=1;s<this.nSegs;s++){
        const p=ray[s],prev=ray[s-1];
        const dx=p.x-prev.x,dy=p.y-prev.y;
        const d=Math.hypot(dx,dy)||0.001;
        const nx=dx/d,ny=dy/d;
        const sN=s/(this.nSegs-1);
        const wp=opts.time*opts.waveFreq+r*0.42+sN*3.2;
        const waveAng=rayAng+Math.sin(wp)*opts.waveAmp*sN;
        const tx=Math.cos(waveAng),ty=Math.sin(waveAng);
        let fx=(tx-nx)*tension;
        let fy=(ty-ny)*tension;
        const le=d-segLen;
        fx+=-nx*le*0.32; fy+=-ny*le*0.32;
        fx+=flow.x*dragK; fy+=flow.y*dragK;
        fy-=0.006;
        p.vx=(p.vx+fx)*0.88; p.vy=(p.vy+fy)*0.88;
        const sp=Math.hypot(p.vx,p.vy);
        const maxSp=3.2*dpr;
        if(sp>maxSp){ p.vx*=maxSp/sp; p.vy*=maxSp/sp; }
        p.x+=p.vx; p.y+=p.vy;
        const ndx=p.x-prev.x,ndy=p.y-prev.y;
        const nd=Math.hypot(ndx,ndy)||0.0001;
        const cl=Math.max(segLen*0.80,Math.min(segLen*1.20,nd));
        if(Math.abs(cl-nd)>0.0005){
          const cx=ndx/nd,cy=ndy/nd;
          p.x=prev.x+cx*cl; p.y=prev.y+cy*cl;
          const vr=p.vx*cx+p.vy*cy;
          p.vx-=cx*vr*0.5; p.vy-=cy*vr*0.5;
        }
      }
    }
    this.init=true;
  }
  draw(edgeCol,memCol,alphaScale,highlight,alphaMul){
    const aS=(alphaScale!=null?alphaScale:1)*(alphaMul!=null?alphaMul:1);
    for(let r=0;r<this.nRays-1;r++){
      const a=this.rays[r],b=this.rays[r+1];
      ctx.beginPath();
      for(let s=0;s<this.nSegs;s++) ctx.lineTo(a[s].x,a[s].y);
      for(let s=this.nSegs-1;s>=0;s--) ctx.lineTo(b[s].x,b[s].y);
      ctx.closePath();
      const fanT=r/(this.nRays-1);
      const memb=0.22+0.16*Math.sin(fanT*Math.PI);
      ctx.fillStyle=memCol; ctx.globalAlpha=memb*aS; ctx.fill();
      if(highlight){
        ctx.globalAlpha=memb*aS*0.30;
        ctx.fillStyle='rgba(255,220,220,0.4)';
        ctx.fill();
      }
    }
    ctx.strokeStyle=edgeCol;
    ctx.lineWidth=0.65*dpr;
    ctx.globalAlpha=0.70*aS;
    ctx.lineCap='round';
    for(let r=0;r<this.nRays;r++){
      const ray=this.rays[r];
      ctx.beginPath(); ctx.moveTo(ray[0].x,ray[0].y);
      for(let s=1;s<this.nSegs;s++){
        const mx=(ray[s].x+ray[s-1].x)/2;
        const my=(ray[s].y+ray[s-1].y)/2;
        ctx.quadraticCurveTo(ray[s-1].x,ray[s-1].y,mx,my);
      }
      ctx.stroke();
    }
    ctx.globalAlpha=1;
  }
}

/* ============================================================
   ARTEMIA — confinada a la banda de nado
   ============================================================ */
class Artemia{
  constructor(x,y){
    this.x=x; this.y=y;
    this.angle=Math.random()*Math.PI*2;
    this.phase=Math.random()*Math.PI*2;
    this.speed=0.35+Math.random()*0.5;
    this.r=1.9*dpr;
    this.eaten=false;
    this.wobble=Math.random()*Math.PI*2;
  }
  update(dt,t){
    this.angle += Math.sin(t*4+this.phase)*0.18*dt;
    this.wobble += dt*5;
    const sp=this.speed*dpr*60*dt*0.55;
    this.x += Math.cos(this.angle)*sp;
    this.y += Math.sin(this.angle)*sp;
    this.y -= 0.06*dpr*60*dt*0.55;

    const topY = H*SWIM_BAND.topFrac + 15*dpr;
    const botY = H*SWIM_BAND.botFrac - 15*dpr;
    if(this.x<20*dpr){this.x=20*dpr; this.angle=Math.PI-this.angle;}
    if(this.x>W-20*dpr){this.x=W-20*dpr; this.angle=Math.PI-this.angle;}
    if(this.y<topY){ this.y=topY; this.angle=-this.angle; }
    if(this.y>botY){ this.y=botY; this.angle=-this.angle; }
  }
  draw(t){
    const wig=Math.sin(this.wobble)*0.6;
    const tx=this.x-Math.cos(this.angle)*this.r*2.0;
    const ty=this.y-Math.sin(this.angle)*this.r*2.0;
    ctx.strokeStyle='rgba(220,150,80,0.55)';
    ctx.lineWidth=0.65*dpr;
    ctx.beginPath();
    ctx.moveTo(this.x,this.y);
    ctx.lineTo(tx+Math.cos(this.angle+Math.PI/2)*wig*this.r,
               ty+Math.sin(this.angle+Math.PI/2)*wig*this.r);
    ctx.stroke();
    ctx.fillStyle='rgba(230,165,90,0.85)';
    ctx.beginPath();
    ctx.ellipse(this.x,this.y,this.r,this.r*0.55,this.angle,0,Math.PI*2);
    ctx.fill();
    const ex=this.x+Math.cos(this.angle)*this.r*0.55;
    const ey=this.y+Math.sin(this.angle)*this.r*0.55;
    ctx.fillStyle='rgba(20,8,4,0.9)';
    ctx.beginPath();
    ctx.arc(ex-Math.sin(this.angle)*this.r*0.25, ey+Math.cos(this.angle)*this.r*0.25, 0.45*dpr,0,Math.PI*2);
    ctx.fill();
  }
}
let artemia=[];
let artemiaSpawnT=0;
function spawnArtemia(){
  const topY = H*SWIM_BAND.topFrac + 20*dpr;
  const botY = H*SWIM_BAND.botFrac - 20*dpr;
  let x,y;
  const s=Math.random();
  if(s<0.4){ x=Math.random()*W; y=botY - Math.random()*60*dpr; }
  else if(s<0.7){ x=Math.random()*W; y=topY + Math.random()*80*dpr; }
  else { x=Math.random()<0.5? W*0.05 : W*0.95; y=topY + Math.random()*(botY-topY); }
  artemia.push(new Artemia(x,y));
}
function updateArtemia(dt,t){
  artemiaSpawnT+=dt;
  if(artemia.length<CFG.ARTEMIA_MAX && artemiaSpawnT>CFG.ARTEMIA_SPAWN_DT){
    spawnArtemia(); artemiaSpawnT=0;
  }
  artemia=artemia.filter(a=>!a.eaten);
  for(const a of artemia) a.update(dt,t);
}

   NEST
   ============================================================ */
class Nest{
  constructor(x,y){
    this.x=x; this.y=y;
    this.bubbles=[];
    this.eggs=[];
    this.built=false;
    this.hatched=false;
    this.t=0;
    this.done=false;
    this.doneT=0;
  }
  addBubble(){
    const a=Math.random()*Math.PI*2;
    const r=Math.random()*30*dpr;
    this.bubbles.push({
      ox:Math.cos(a)*r, oy:Math.sin(a)*r*0.5,
      r:(2.5+Math.random()*3)*dpr,
      phase:Math.random()*Math.PI*2,
    });
    bubblePop();
  }
  addEgg(){
    this.eggs.push({
      ox:(Math.random()-0.5)*40*dpr,
      oy:8*dpr+Math.random()*6*dpr,
      r:1.6*dpr,
      phase:Math.random()*Math.PI*2,
    });
  }
  update(dt){
    this.t+=dt;
    if(!this.built && this.bubbles.length>=CFG.NEST_BUBBLES){
      this.built=true;
      for(let i=0;i<20;i++) this.addEgg();
    }
  }
  draw(t, alpha){
    alpha = (alpha==null) ? 1 : alpha;
    ctx.save();
    ctx.globalAlpha = alpha;
    for(const b of this.bubbles){
      const bob=Math.sin(t*1.2+b.phase)*1.2*dpr;
      const cx=this.x+b.ox, cy=this.y+b.oy+bob;
      ctx.strokeStyle='rgba(200,230,220,0.55)';
      ctx.lineWidth=0.6*dpr;
      ctx.beginPath(); ctx.arc(cx,cy,b.r,0,Math.PI*2); ctx.stroke();
      ctx.fillStyle='rgba(180,220,210,0.18)';
      ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.4)';
      ctx.beginPath(); ctx.arc(cx-b.r*0.3,cy-b.r*0.3,b.r*0.3,0,Math.PI*2); ctx.fill();
    }
    for(const e of this.eggs){
      const bob=Math.sin(t*1.4+e.phase)*0.6*dpr;
      ctx.fillStyle='rgba(230,220,190,0.75)';
      ctx.beginPath(); ctx.arc(this.x+e.ox, this.y+e.oy+bob, e.r, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
}

/* ============================================================
   FOOD INVITATION — círculo (moneda de 5 pesos), sin texto
   ============================================================ */
const foodCircle = { x:0, y:0, r:0 };
let foodHintMotes=[];
let foodHoverT=0;
function initFoodHint(){
  foodCircle.r = 30*dpr;
  foodCircle.x = W*0.5;
  foodCircle.y = foodCircle.r + 20*dpr;
  foodHintMotes=[];
  for(let i=0;i<16;i++){
    const a=Math.random()*Math.PI*2;
    const rr=Math.random()*foodCircle.r*0.8;
    foodHintMotes.push({
      ox:Math.cos(a)*rr,
      oy:Math.sin(a)*rr,
      r:(0.6+Math.random()*1.1)*dpr,
      speed:0.22+Math.random()*0.35,
      phase:Math.random()*Math.PI*2,
      baseA:0.25+Math.random()*0.35,
    });
  }
}
function drawFoodHint(t, dt, mouse){
  let hovering=false;
  if(mouse){
    const dx=mouse.x-foodCircle.x, dy=mouse.y-foodCircle.y;
    if(Math.hypot(dx,dy) < foodCircle.r*1.35) hovering=true;
  }
  if(hovering) foodHoverT=Math.min(1, foodHoverT+dt*2.4);
  else         foodHoverT=Math.max(0, foodHoverT-dt*1.0);

  const pulse = 1 + Math.sin(t*1.9)*0.07;
  const r = foodCircle.r * pulse;
  const intensity = 0.30 + 0.70*foodHoverT;

  const g=ctx.createRadialGradient(foodCircle.x, foodCircle.y, 0, foodCircle.x, foodCircle.y, r*2.6);
  g.addColorStop(0, `rgba(230,200,110,${0.20*intensity})`);
  g.addColorStop(0.5, `rgba(180,150,70,${0.08*intensity})`);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.arc(foodCircle.x, foodCircle.y, r*2.6, 0, Math.PI*2); ctx.fill();

  ctx.strokeStyle = `rgba(240,215,130,${(0.40 + 0.45*foodHoverT)*(0.75+0.25*Math.sin(t*2.2))})`;
  ctx.lineWidth = 1.2*dpr;
  ctx.beginPath(); ctx.arc(foodCircle.x, foodCircle.y, r, 0, Math.PI*2); ctx.stroke();

  const g2=ctx.createRadialGradient(foodCircle.x, foodCircle.y, 0, foodCircle.x, foodCircle.y, r);
  g2.addColorStop(0, `rgba(255,230,150,${0.08+0.20*foodHoverT})`);
  g2.addColorStop(1, 'rgba(255,230,150,0)');
  ctx.fillStyle=g2;
  ctx.beginPath(); ctx.arc(foodCircle.x, foodCircle.y, r, 0, Math.PI*2); ctx.fill();

  for(const m of foodHintMotes){
    m.phase += dt*1.8;
    m.oy -= m.speed*dpr*60*dt;
    if(m.oy < -foodCircle.r*0.9){
      const a=Math.random()*Math.PI*2;
      const rr=Math.random()*foodCircle.r*0.7;
      m.ox=Math.cos(a)*rr;
      m.oy=foodCircle.r*0.85;
    }
    const dd = Math.hypot(m.ox, m.oy);
    if(dd > foodCircle.r*0.95){ m.ox*=0.9; m.oy*=0.9; }
    const px = foodCircle.x + m.ox;
    const py = foodCircle.y + m.oy;
    const a=m.baseA*(0.55+0.45*Math.sin(m.phase))*(0.5+0.5*foodHoverT+0.2);
    ctx.globalAlpha=Math.min(0.9,a);
    ctx.fillStyle='rgba(240,215,130,1)';
    ctx.beginPath(); ctx.arc(px,py,m.r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
}

   BETTA — IDÉNTICO a tu archivo original

const PALETTES = {
  male:{
    body:['#07110d','#173326','#214c39','#1f5362','#173a45','#081b20'],
    headLight:'#254c3a',headDark:'#07120d',scaleCol:'120,210,255',

    anal:{edge:'#260707',mem:'#b71f24',hi:false},
    pect:{edge:'#163848',mem:'#4f97b4',hi:false},
    ventral:{edge:'#16332a',mem:'#4a8068',hi:false},stripe:null
  },
  female:{

    headLight:'#3a3420',headDark:'#151208',scaleCol:'255,200,120',
    caudal:{edge:'#4a1a08',mem:'#a83a1a',hi:false},

  }

const VARIANT_STYLE={
  original:{bodyScale:1,caudal:[34,28,155,1.75],dorsal:[16,20,62,1.05],anal:[22,24,92,1.15],colorShift:0},
  superDelta:{bodyScale:.98,caudal:[26,26,128,1.48],dorsal:[14,19,58,1.00],anal:[20,23,86,1.08],colorShift:1},
  halfmoon:{bodyScale:.97,caudal:[38,29,170,1.95],dorsal:[18,21,68,1.15],anal:[25,25,100,1.22],colorShift:2},
  roseTail:{bodyScale:.96,caudal:[46,31,158,1.78],dorsal:[20,22,72,1.18],anal:[28,26,104,1.25],colorShift:3},
  crowntail:{bodyScale:.98,caudal:[30,26,150,1.65],dorsal:[16,20,64,1.08],anal:[22,24,94,1.16],colorShift:4}
};

class Betta{
  constructor(sex,opts){
    opts=opts||{};
    this.sex=sex;
    this.pal=PALETTES[sex];
    this.variant=opts.variant||'original';
    this.isFounder=opts.isFounder===true;
    this.isAdult=opts.isAdult!==false;
    this.growthProgress=this.isAdult?1:0;
    const style=VARIANT_STYLE[this.variant]||VARIANT_STYLE.original;
    const baseScale=this.isAdult?1:.30;
    const maleBig=sex==='male'?1:.85;

    /* cuerpo deliberadamente fino, Betta y no carassius */
    this.bodyLen=64*dpr*maleBig*baseScale*style.bodyScale;
    this.bodyWidthFactor=.215;
    this.spine=new Spine(this.bodyLen,18);

    const finScale=this.isAdult?1:.55;
    const maleFinMul=sex==='male'?1:.68;
    this.caudal=new RayFin(style.caudal[0],style.caudal[1],style.caudal[2]*dpr*maleFinMul*finScale,style.caudal[3]);
    this.dorsal=new RayFin(style.dorsal[0],style.dorsal[1],style.dorsal[2]*dpr*maleFinMul*finScale,style.dorsal[3]);
    this.anal=new RayFin(style.anal[0],style.anal[1],style.anal[2]*dpr*maleFinMul*finScale,style.anal[3]);
    this.pectL=new RayFin(11,14,30*dpr*finScale,.85);
    this.pectR=new RayFin(11,14,30*dpr*finScale,.85);
    this.ventralL=new RayFin(4,22,58*dpr*maleFinMul*finScale,.18);
    this.ventralR=new RayFin(4,22,56*dpr*maleFinMul*finScale,.18);

    const yMin=H*SWIM_BAND.topFrac+60*dpr, yMax=H*SWIM_BAND.botFrac-60*dpr;
    this.x=opts.x!==undefined?opts.x:W*.5;
    this.y=opts.y!==undefined?opts.y:(yMin+yMax)*.5;
    this.vx=0;this.vy=0;this.angle=Math.random()*Math.PI*2;this.time=0;
    this.opacity=this.isAdult?1:.7;

    /* 1 cercano, 2 medio, 3 profundo. */
    this.depthPlane=opts.depthPlane||2;
    this.depthTarget=this.depthPlane;
    this.depthT=0;

    this.state='cruise';this.stateT=0;this.target={x:W*.7,y:(yMin+yMax)*.5};this.lastBubble=0;this.pickTarget();
    this.sStartT=0;this.sStartDur=.35;this.sStartDir=1;
    this.artemiaEaten=0;this.veilScale=1;this.pelletEaten=0;this.nest=null;this.nestingPhase=null;this.nestingT=0;this.hatchTimer=0;this.laidEggs=false;
    this.cur={waveAmp:.14,waveFreq:.85,wavelength:1,thrust:.010,turnRate:.018,extCaudal:.55,extDorsal:.50,extAnal:.50,extPectL:.70,extPectR:.70,extVentral:.55,pectSpeed:5.5,gillFlare:0};
    this.tgt={...this.cur};
    this.micLevel=0;this.micPrev=0;this.micDeriv=0;
  }

  getDepthScale(){ return this.depthPlane===1?1.10:(this.depthPlane===3?.78:.94); }
  setDepthPlane(p){this.depthTarget=Math.max(1,Math.min(3,p));}
  updateDepth(dt){
    if(this.depthPlane!==this.depthTarget){
      this.depthT=Math.min(1,this.depthT+dt*.18);
      if(this.depthT>=1){this.depthPlane=this.depthTarget;this.depthT=0;}
    }
  }
  pickTarget(){
    const yMin=H*SWIM_BAND.topFrac+this.bodyLen*.6+30*dpr;
    const yMax=H*SWIM_BAND.botFrac-this.bodyLen*.6-20*dpr;
    let tries=0,tx,ty;
    do{tx=W*(.10+Math.random()*.80);ty=yMin+Math.random()*(yMax-yMin);tries++;}while(Math.hypot(tx-this.x,ty-this.y)<260*dpr&&tries<25);
    this.target.x=tx;this.target.y=ty;
    /* peces fluyen autónomamente entre los planos 1–3 */
    if(Math.random()<.18) this.setDepthPlane(1+Math.floor(Math.random()*3));
  }
  startSStart(dir){this.state='burst';this.stateT=0;this.sStartT=0;this.sStartDir=dir||(Math.random()<.5?1:-1);this.pickTarget();}
  startNesting(){
    if(!this.isFounder || reproductionComplete || createdBettas>=MAX_BETTAS) return;
    const nx=W*(.30+Math.random()*.40),ny=H*.13;
    this.nest=new Nest(nx,ny);nests.push(this.nest);this.state='nesting';this.nestingPhase='build';this.nestingT=0;
    const yMin=H*SWIM_BAND.topFrac+this.bodyLen*.6;this.target.x=nx;this.target.y=Math.max(yMin,ny+40*dpr);
  }
  easeTo(target,ease,dt){for(const k in target)if(k in this.cur)this.cur[k]+=(target[k]-this.cur[k])*Math.min(1,ease*dt);}

  update(dt){
    this.time+=dt;this.stateT+=dt;this.updateDepth(dt);
    const mLvl=this.micLevel,mDer=this.micDeriv;

    /* el micrófono estimula la física; no anima directamente los velos */
    if(micActive && mDer>.055 && this.state!=='nesting' && this.state!=='burst') {
      this.vx += Math.cos(this.angle)*(mDer*.018 + (this.micBass||0)*.004);
      this.vy += Math.sin(this.angle)*(mDer*.018 + (this.micBass||0)*.004);
      if(mDer>.30) this.startSStart();
    }

    if(micActive&&this.state!=='nesting'&&this.state!=='burst'){
      if(mDer>.30){}
      else if(mLvl>.09&&mLvl<.28&&this.state!=='display'&&this.isAdult){this.state='display';this.stateT=0;this.target.x=this.x+Math.cos(this.angle+Math.PI/2)*100*dpr;this.target.y=this.y+Math.sin(this.angle+Math.PI/2)*100*dpr;}
      else if(mLvl<.022&&this.state==='display'&&this.stateT>1.8){this.state='cruise';this.stateT=0;this.pickTarget();}
    }

    let nearestA=null,nA=1e9;
    if(this.state!=='nesting'&&this.state!=='burst'&&this.state!=='display'&&this.isAdult){for(const a of artemia){const d=Math.hypot(a.x-this.x,a.y-this.y);if(d<nA&&d<220*dpr){nA=d;nearestA=a;}}}
    if(!this.isAdult&&this.state!=='burst'){for(const a of artemia){const d=Math.hypot(a.x-this.x,a.y-this.y);if(d<nA&&d<180*dpr){nA=d;nearestA=a;}}}
    if(nearestA&&this.state!=='burst'&&this.state!=='nesting'&&this.state!=='display'){this.target.x=nearestA.x;this.target.y=nearestA.y;}

    const head=this.spine.pts[0];
    const eatR=this.isAdult?14*dpr:9*dpr;
    for(const a of artemia){
      if(a.eaten)continue;
      if(Math.hypot(a.x-head.x,a.y-head.y)<eatR){
        a.eaten=true;this.artemiaEaten++;if(actx&&Math.random()<.35)bubbleSnd(.6,.8+Math.random()*.4);
        if(!this.isAdult){
          this.growthProgress=Math.min(1,this.artemiaEaten/CFG.ARTEMIA_TO_GROW);
          if(this.growthProgress>=1){
            this.isAdult=true;this.artemiaEaten=0;this.growthProgress=1;this.opacity=1;
            const maleBig=this.sex==='male'?1:.85;const style=VARIANT_STYLE[this.variant]||VARIANT_STYLE.original;
            this.bodyLen=64*dpr*maleBig*style.bodyScale;this.spine=new Spine(this.bodyLen,18);
            this.caudal.baseLen=style.caudal[2]*dpr*(this.sex==='male'?1:.68);this.dorsal.baseLen=style.dorsal[2]*dpr*(this.sex==='male'?1:.68);this.anal.baseLen=style.anal[2]*dpr*(this.sex==='male'?1:.68);this.veilScale=1;this.pickTarget();
            grownBettas++;
            if(grownBettas>=MAX_BETTAS)reproductionComplete=true;
          }
        }else if(this.isFounder&&!reproductionComplete&&createdBettas<MAX_BETTAS){
          if(this.artemiaEaten>=CFG.ARTEMIA_TO_NEST&&this.state!=='nesting'&&!this.nest)this.startNesting();
        }
      }
    }

    let nearestP=null,nP=1e9;
    for(const p of pellets){if(p.eaten)continue;const d=Math.hypot(p.x-this.x,p.y-this.y);if(d<nP){nP=d;nearestP=p;}}
    if(nearestP&&nP<600*dpr&&this.state!=='nesting'&&this.state!=='burst'){this.target.x=nearestP.x;this.target.y=nearestP.y;const dHead=Math.hypot(nearestP.x-head.x,nearestP.y-head.y);if(dHead<16*dpr){nearestP.eaten=true;this.pelletEaten++;this.veilScale=Math.min(1.5,this.veilScale+.1);this.fedRecently=2.5;if(actx)bubbleSnd(1.2,.9+Math.random()*.5);this.pickTarget();}}

    if(this.state==='nesting'){
      this.nestingT+=dt;const yMinN=H*SWIM_BAND.topFrac+this.bodyLen*.6;this.target.x=this.nest.x;this.target.y=Math.max(yMinN,this.nest.y+40*dpr);
      if(this.nestingPhase==='build'){
        if(this.time-this.lastBubble>CFG.NEST_BUILD_DT){this.nest.addBubble();this.lastBubble=this.time;}
        if(this.nest.bubbles.length>=CFG.NEST_BUBBLES){this.nestingPhase='lay';this.nestingT=0;}
      }else if(this.nestingPhase==='lay'){
        this.nest.update(dt);if(this.nestingT>6){this.nestingPhase='guard';this.nestingT=0;this.hatchTimer=0;}
      }else if(this.nestingPhase==='guard'){
        this.hatchTimer+=dt;
        if(this.hatchTimer>CFG.HATCH_DELAY&&!this.nest.hatched){
          this.nest.hatched=true;
          spawnBaby(this);
          this.artemiaEaten=0;this.nest.done=true;this.nest=null;this.state='cruise';this.stateT=0;this.pickTarget();
        }
      }
    }else if(this.state==='burst'){
      this.sStartT+=dt;const tN=this.sStartT/this.sStartDur;if(tN>=1&&this.stateT>.9){const sp=Math.hypot(this.vx,this.vy);if(sp<.05){this.state='cruise';this.stateT=0;this.pickTarget();}}
    }else if(this.state==='cruise'){
      const dTgt=Math.hypot(this.target.x-this.x,this.target.y-this.y);if(dTgt<60*dpr||this.stateT>7+Math.random()*5){if(Math.random()<.30){this.state='hover';this.stateT=0;}else{this.pickTarget();this.stateT=0;}}
    }else if(this.state==='hover'){if(this.stateT>1.6+Math.random()*2.2){this.state='cruise';this.stateT=0;this.pickTarget();}}

    let tg={...this.cur};
    if(this.state==='hover')tg={waveAmp:.025,waveFreq:.45,wavelength:1,thrust:.0025,turnRate:.012,extCaudal:.50,extDorsal:.55,extAnal:.55,extPectL:.85,extPectR:.85,extVentral:.70,pectSpeed:7,gillFlare:0};
    else if(this.state==='cruise')tg={waveAmp:.14,waveFreq:.85,wavelength:1,thrust:.010,turnRate:.020,extCaudal:.62,extDorsal:.42,extAnal:.42,extPectL:.35,extPectR:.35,extVentral:.40,pectSpeed:3.2,gillFlare:0};
    else if(this.state==='burst')tg={waveAmp:.85,waveFreq:4.8,wavelength:.95,thrust:.075,turnRate:.10,extCaudal:.85,extDorsal:.15,extAnal:.15,extPectL:.10,extPectR:.10,extVentral:.20,pectSpeed:1,gillFlare:.35};
    else if(this.state==='display')tg={waveAmp:.10,waveFreq:.7,wavelength:1.1,thrust:.003,turnRate:.030,extCaudal:1,extDorsal:1,extAnal:1,extPectL:.95,extPectR:.95,extVentral:1,pectSpeed:5,gillFlare:1};
    else if(this.state==='nesting'){
      const pp=this.nestingPhase==='build'?{waveAmp:.06,waveFreq:.7,thrust:.004,turnRate:.020}:this.nestingPhase==='lay'?{waveAmp:.08,waveFreq:.9,thrust:.003,turnRate:.030}:{waveAmp:.05,waveFreq:.6,thrust:.002,turnRate:.025};
      tg={...pp,extCaudal:.85,extDorsal:.75,extAnal:.75,extPectL:.85,extPectR:.85,extVentral:.80,pectSpeed:5.5,gillFlare:.4};
    }else tg={waveAmp:.16,waveFreq:1.05,wavelength:.95,thrust:.014,turnRate:.045,extCaudal:.70,extDorsal:.35,extAnal:.35,extPectL:.30,extPectR:.30,extVentral:.40,pectSpeed:3,gillFlare:0};
    this.easeTo(tg,3.5,dt);

    if(this.state!=='display'){
      const dx=this.target.x-this.x,dy=this.target.y-this.y,want=Math.atan2(dy,dx),diff=Math.atan2(Math.sin(want-this.angle),Math.cos(want-this.angle));
      const spF=Math.min(1,Math.hypot(this.vx,this.vy)*40);this.angle+=diff*this.cur.turnRate*(.5+.5*spF);this.vx+=Math.cos(this.angle)*this.cur.thrust;this.vy+=Math.sin(this.angle)*this.cur.thrust;
    }

    const speed=Math.hypot(this.vx,this.vy),drag=.020+speed*.020;this.vx*=1-drag;this.vy*=1-drag;const MAXV=this.isAdult?1.8:1.2;if(speed>MAXV){this.vx*=MAXV/speed;this.vy*=MAXV/speed;}
    this.x+=this.vx*dpr*60*dt;this.y+=this.vy*dpr*60*dt;

    const M=this.bodyLen*1.2+40*dpr,topY=H*SWIM_BAND.topFrac+this.bodyLen*.4,botY=H*SWIM_BAND.botFrac-this.bodyLen*.4;let bounced=false;
    if(this.x<M){this.vx=Math.abs(this.vx)*.5;this.x=M;bounced=true;}if(this.x>W-M){this.vx=-Math.abs(this.vx)*.5;this.x=W-M;bounced=true;}if(this.y<topY){this.vy=Math.abs(this.vy)*.5;this.y=topY;bounced=true;}if(this.y>botY){this.vy=-Math.abs(this.vy)*.5;this.y=botY;bounced=true;}if(bounced&&this.state!=='burst'&&this.state!=='nesting')this.pickTarget();

    const wv={freq:this.cur.waveFreq,amp:this.cur.waveAmp,wavelength:this.cur.wavelength};let curvFn=null;
    if(this.state==='burst'){const tN=this.sStartT/this.sStartDur;if(tN<1)curvFn=(s,t)=>{const env=Math.sin(tN*Math.PI),lobe=Math.sin(s*Math.PI),sign=tN<.5?this.sStartDir:-this.sStartDir;return sign*env*lobe*.10;};}
    this.spine.update(this.x,this.y,this.angle,wv,this.time,curvFn);

    let flow={x:-this.vx*1.5,y:-this.vy*1.5};flow.x=Math.max(-2.5,Math.min(2.5,flow.x));flow.y=Math.max(-2.5,Math.min(2.5,flow.y));
    const peduncle=this.spine.pts[this.spine.n-1],midBody=this.spine.pts[7],midBody2=this.spine.pts[11],pectBase=this.spine.pts[3];
    this.caudal.lenScale=this.veilScale;this.caudal.fanScale=this.veilScale*.9+.1;this.anal.lenScale=.5+.5*this.veilScale;this.dorsal.lenScale=.5+.5*this.veilScale;
    this.caudal.update(peduncle.x,peduncle.y,peduncle.a+Math.PI,flow,{targetExt:this.cur.extCaudal,waveAmp:.22+this.cur.waveAmp*.3,waveFreq:.7+this.cur.waveFreq*.5,dragK:.055,spread:1,time:this.time,dt});
    this.dorsal.update(midBody.x,midBody.y-5*dpr,midBody.a-Math.PI*.58,flow,{targetExt:this.cur.extDorsal,waveAmp:.09,waveFreq:.6,dragK:.035,spread:.9,time:this.time,dt});
    this.anal.update(midBody2.x,midBody2.y+6*dpr,midBody2.a-Math.PI*.42,flow,{targetExt:this.cur.extAnal,waveAmp:.09,waveFreq:.65,dragK:.035,spread:.9,time:this.time,dt});
    const pectPh=this.time*this.cur.pectSpeed,pAngL=pectBase.a+Math.PI*.55+Math.sin(pectPh)*.55,pAngR=pectBase.a-Math.PI*.55+Math.sin(pectPh+Math.PI)*.55;
    this.pectL.update(pectBase.x,pectBase.y-6*dpr,pAngL,flow,{targetExt:this.cur.extPectL,waveAmp:.16,waveFreq:this.cur.pectSpeed*.9,dragK:.06,spread:.6,time:this.time,dt});
    this.pectR.update(pectBase.x,pectBase.y+6*dpr,pAngR,flow,{targetExt:this.cur.extPectR,waveAmp:.16,waveFreq:this.cur.pectSpeed*.9,dragK:.06,spread:.6,time:this.time,dt});
    const vb=this.spine.pts[5],vAngL=this.angle+Math.PI/2+.55+Math.sin(this.time*.9)*.10,vAngR=this.angle+Math.PI/2-.55+Math.sin(this.time*.9+.4)*.10;
    this.ventralL.update(vb.x,vb.y+3*dpr,vAngL,{x:flow.x*.2,y:flow.y*.2+.4},{targetExt:this.cur.extVentral,waveAmp:.055,waveFreq:.55,dragK:.025,spread:.4,time:this.time,dt});
    this.ventralR.update(vb.x,vb.y+4*dpr,vAngR,{x:flow.x*.2,y:flow.y*.2+.4},{targetExt:this.cur.extVentral,waveAmp:.055,waveFreq:.55,dragK:.025,spread:.4,time:this.time,dt});

    if(actx&&this.time-this.lastBubble>4.5+Math.random()*4){bubbleSnd(.7,.75+Math.random()*.5);this.lastBubble=this.time;}
  }

  draw(){
    const pal=this.pal,op=this.opacity,depth=this.getDepthScale();
    ctx.save();ctx.globalAlpha=op;
    if(this.depthPlane===3)ctx.globalAlpha*=.68;
    if(this.depthPlane===1)ctx.globalAlpha*=1.05;
    ctx.translate(this.x,this.y);ctx.scale(depth,depth);ctx.translate(-this.x,-this.y);

    this.ventralL.draw(pal.ventral.edge,pal.ventral.mem,.9,pal.ventral.hi);
    this.ventralR.draw(pal.ventral.edge,pal.ventral.mem,.9,pal.ventral.hi);
    this.anal.draw(pal.anal.edge,pal.anal.mem,1,pal.anal.hi);
    this.dorsal.draw(pal.dorsal.edge,pal.dorsal.mem,1,pal.dorsal.hi);
    this.caudal.draw(pal.caudal.edge,pal.caudal.mem,1,pal.caudal.hi);

    const N=this.spine.n;
    ctx.beginPath();
    for(let i=0;i<N;i++){
      const p=this.spine.pts[i],t=i/(N-1);
      /* cuerpo más estrecho */
      const depthW=this.bodyLen*this.bodyWidthFactor*(.78+.28*Math.sin(t*Math.PI*.85)-.42*Math.pow(t,2.2));
      const nx=Math.cos(p.a+Math.PI/2),ny=Math.sin(p.a+Math.PI/2);
      if(i===0)ctx.moveTo(p.x+nx*depthW,p.y+ny*depthW);else ctx.lineTo(p.x+nx*depthW,p.y+ny*depthW);
    }
    for(let i=N-1;i>=0;i--){const p=this.spine.pts[i],t=i/(N-1),depthW=this.bodyLen*this.bodyWidthFactor*(.78+.28*Math.sin(t*Math.PI*.85)-.42*Math.pow(t,2.2));ctx.lineTo(p.x+Math.cos(p.a-Math.PI/2)*depthW*.85,p.y+Math.sin(p.a-Math.PI/2)*depthW*.85);}
    ctx.closePath();

    const g=ctx.createLinearGradient(this.spine.pts[0].x,this.spine.pts[0].y,this.spine.pts[N-1].x,this.spine.pts[N-1].y),bc=pal.body;
    g.addColorStop(0,bc[0]);g.addColorStop(.20,bc[1]);g.addColorStop(.42,bc[2]);g.addColorStop(.65,bc[3]);g.addColorStop(.85,bc[4]);g.addColorStop(1,bc[5]);ctx.fillStyle=g;ctx.fill();

    ctx.save();ctx.clip();
    for(let i=2;i<N-2;i++)for(let r=-1;r<=1;r++){
      const p=this.spine.pts[i],sx=p.x+Math.cos(p.a+Math.PI/2)*r*5*dpr,sy=p.y+Math.sin(p.a+Math.PI/2)*r*5*dpr,irid=Math.sin(i*.9+r*.7)*.5+.5;
      if(irid>.55){ctx.fillStyle=`rgba(${pal.scaleCol},${.10+.16*irid})`;ctx.beginPath();ctx.ellipse(sx,sy,4*dpr,2.6*dpr,p.a,0,Math.PI*2);ctx.fill();}
    }
    ctx.restore();

    const head=this.spine.pts[0];ctx.save();ctx.translate(head.x,head.y);ctx.rotate(head.a);
    const hg=ctx.createRadialGradient(6*dpr,-2*dpr,1,4*dpr,0,15*dpr);hg.addColorStop(0,pal.headLight);hg.addColorStop(1,pal.headDark);ctx.fillStyle=hg;
    ctx.beginPath();ctx.moveTo(-4*dpr,-9*dpr);ctx.quadraticCurveTo(8*dpr,-11*dpr,13*dpr,-5*dpr);ctx.quadraticCurveTo(16*dpr,0,13*dpr,5*dpr);ctx.quadraticCurveTo(8*dpr,10*dpr,-4*dpr,9*dpr);ctx.quadraticCurveTo(-10*dpr,4*dpr,-10*dpr,0);ctx.quadraticCurveTo(-10*dpr,-4*dpr,-4*dpr,-9*dpr);ctx.closePath();ctx.fill();
    const gf=this.cur.gillFlare;if(gf>.02){ctx.globalAlpha=Math.min(1,gf)*op;ctx.fillStyle='rgba(150,25,25,.5)';ctx.beginPath();ctx.ellipse(-7*dpr,3*dpr,9*dpr*gf,6*dpr*gf,.3,0,Math.PI*2);ctx.fill();ctx.globalAlpha=op;}
    ctx.fillStyle='#030a06';ctx.beginPath();ctx.arc(11*dpr,-2*dpr,7.5*dpr,0,Math.PI*2);ctx.fill();ctx.fillStyle=this.sex==='male'?'#1a4a5e':'#5a4028';ctx.beginPath();ctx.arc(11*dpr,-2*dpr,5.6*dpr,0,Math.PI*2);ctx.fill();ctx.fillStyle='#020202';ctx.beginPath();ctx.arc(11.9*dpr,-2*dpr,3.3*dpr,0,Math.PI*2);ctx.fill();ctx.fillStyle='#eafaff';ctx.globalAlpha=.95*op;ctx.beginPath();ctx.arc(12.9*dpr,-3.9*dpr,1.6*dpr,0,Math.PI*2);ctx.fill();ctx.restore();
    this.pectL.draw(pal.pect.edge,pal.pect.mem,1,pal.pect.hi,op);this.pectR.draw(pal.pect.edge,pal.pect.mem,1,pal.pect.hi,op);
    ctx.restore();
  }
}
/* ============================================================
   CRÍAS
   ============================================================ */
let babies=[];
function spawnBaby(parent){
  if(createdBettas>=MAX_BETTAS || reproductionComplete) return null;
  const nextIndex=createdBettas;
  const variant=BIRTH_VARIANTS[nextIndex];
  if(!variant)return null;

  const b=new Betta(parent.sex,{
    isAdult:false,
    isFounder:false,
    variant,
    x:parent.nest.x+(Math.random()-.5)*20*dpr,
    y:parent.nest.y+20*dpr,
    depthPlane:2
  });
  b.opacity=.72;
  babies.push(b);
  createdBettas++;
  if(actx)bubbleSnd(1.5,1.2+Math.random()*.4);
  return b;
}

function allBettas(){ return [betta,...babies]; }
/* ============================================================
   PELLETS — caen dentro de la banda de nado
   ============================================================ */
class Pellet{
  constructor(x,y){
    this.x=x; this.y=y;
    this.vx=(Math.random()-0.5)*0.15;
    this.vy=0.32+Math.random()*0.12;
    this.r=2.6*dpr;
    this.phase=Math.random()*Math.PI*2;
    this.eaten=false;
    this.restT=0;
    this.floorY = H*SWIM_BAND.botFrac - 25*dpr;
  }
  update(dt){
    this.y+=this.vy*dpr*60*dt;
    this.x+=Math.sin(this.phase+performance.now()*0.002)*0.4*dpr;
    if(this.y>this.floorY){ this.y=this.floorY; this.vy=0; this.restT+=dt; }
  }
  draw(){
    ctx.fillStyle='rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.arc(this.x,this.y,this.r*1.4,0,Math.PI*2); ctx.fill();
    const g=ctx.createRadialGradient(this.x-this.r*0.3,this.y-this.r*0.3,0,this.x,this.y,this.r);
    g.addColorStop(0,'#b89460'); g.addColorStop(0.5,'#8a6638'); g.addColorStop(1,'#4a3518');
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(this.x,this.y,this.r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(255,240,200,0.5)';
    ctx.beginPath(); ctx.arc(this.x-this.r*0.3,this.y-this.r*0.3,this.r*0.35,0,Math.PI*2); ctx.fill();
  }
}
let pellets=[];

/* ============================================================
   INSTANCIAS
   ============================================================ */
let betta;
let mouse=null;

function start(){
  resize();
  initFoodHint();
  const sex=Math.random()<.5?'male':'female';
  betta=new Betta(sex,{variant:'original',isFounder:true,isAdult:true,depthPlane:2});
}

start();
addEventListener('resize',()=>{resize();initFoodHint();});

/* ============================================================
   LOOP — 5 planos reales
   ============================================================ */
let last=performance.now();
function loop(now){
  const dt=Math.min((now-last)/1000,.033);last=now;const t=now/1000;

  readMic();

  /* PLANO 5: agua / fondo */
  ctx.drawImage(swampCanvas,0,0);

  /* PLANO 4: vegetación lejana */
  drawPlantsSet(t,plants,.62);
  drawMotes(dt);

  /* nidos */
  for(const n of nests){
    if(n.done)n.doneT+=dt;
    const a=n.done?Math.max(0,1-n.doneT/15):1;
    n.draw(t,a);
  }
  nests=nests.filter(n=>!(n.done&&n.doneT>=15));

  /* Artemia */
  updateArtemia(dt,t);
  for(const a of artemia)a.draw(t);

  /* pellets */
  for(const p of pellets)if(!p.eaten){p.update(dt);p.draw();}
  pellets=pellets.filter(p=>!p.eaten&&p.restT<12);

  /* Actualización de todos los peces */
  const fishes=allBettas();
  for(const f of fishes)f.update(dt);

  /* PLANO 3 — peces profundos */
  for(const f of fishes)if(f.depthPlane===3)f.draw();

  /* vegetación media sobre parte del espacio */
  drawPlantsSet(t,plants,.42);

  /* PLANO 2 — peces medios */
  for(const f of fishes)if(f.depthPlane===2)f.draw();

  /* PLANO 1 — peces cercanos */
  for(const f of fishes)if(f.depthPlane===1)f.draw();

  /* vegetación frontal, como la fotografía */
  drawPlantsSet(t,plantsFg,1);

  drawFoodHint(t,dt,mouse);

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ============================================================
   EVENTOS
   ============================================================ */
canvas.addEventListener('mousemove', e=>{
  const r=canvas.getBoundingClientRect();
  mouse={x:(e.clientX-r.left)*dpr, y:(e.clientY-r.top)*dpr};
});
canvas.addEventListener('mouseleave', ()=>{ mouse=null; });

canvas.addEventListener('click', ()=>{ initAudio(); });

canvas.addEventListener('dblclick', e=>{
  const r=canvas.getBoundingClientRect();
  const x=(e.clientX-r.left)*dpr, y=(e.clientY-r.top)*dpr;
  const dx=x-foodCircle.x, dy=y-foodCircle.y;
  if(Math.hypot(dx,dy) < foodCircle.r*1.4){
    pellets.push(new Pellet(foodCircle.x, foodCircle.y - 4*dpr));
    for(let i=0;i<3;i++) setTimeout(()=>bubbleSnd(0.7, 1.0+Math.random()*0.4), i*60);
  }
});

let lastTapT=0, lastTapX=0, lastTapY=0;
canvas.addEventListener('touchstart', e=>{
  initAudio();
  const r=canvas.getBoundingClientRect();
  const x=(e.touches[0].clientX-r.left)*dpr, y=(e.touches[0].clientY-r.top)*dpr;
  const nowT=performance.now();
  const near = Math.hypot(x-lastTapX, y-lastTapY) < 60*dpr;
  if(nowT-lastTapT<350 && near){
    const dx=x-foodCircle.x, dy=y-foodCircle.y;
    if(Math.hypot(dx,dy) < foodCircle.r*1.6){
      pellets.push(new Pellet(foodCircle.x, foodCircle.y - 4*dpr));
      for(let i=0;i<3;i++) setTimeout(()=>bubbleSnd(0.7,1.0+Math.random()*0.4),i*60);
    }
    lastTapT=0;
  } else {
    lastTapT=nowT; lastTapX=x; lastTapY=y;
  }
}, {passive:true});
</script>
