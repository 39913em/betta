<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Betta</title>
<style>
  html,body{margin:0;padding:0;background:#020503;width:100%;height:100%;overflow:hidden;cursor:crosshair}
  canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
let W,H,dpr;

const CFG = {
  ARTEMIA_TO_NEST: 500,
  ARTEMIA_TO_GROW: 500,
  ARTEMIA_MAX: 42,
  ARTEMIA_SPAWN_DT: 0.7,
  HATCH_DELAY: 10,
  NEST_BUBBLES: 40,
  NEST_BUILD_DT: 0.35,
};

// ===== PLANOS: banda de nado del pez (plano 2) =====
const SWIM_BAND = { topFrac: 0.08, botFrac: 0.93 };
const WATER_FLOOR_FRAC = 0.91;
const DEPTH_MIN=1, DEPTH_MAX=5;
const MAX_BETTAS = 5;
const BIRTH_VARIANTS = ['original','superDelta','halfmoon','roseTail','crowntail'];
let reproductionComplete = false;
let createdBettas = 1;
let grownBettas = 1;

function resize(){
  dpr=Math.min(devicePixelRatio||1,1.8);
  W=canvas.width=innerWidth*dpr;
  H=canvas.height=innerHeight*dpr;
  canvas.style.width=innerWidth+'px';
  canvas.style.height=innerHeight+'px';
  buildSwamp();
}

/* ============================================================
   AUDIO
   ============================================================ */
let actx,master,started=false,analyser,micData,micActive=false;
async function initAudio(){
  if(started) return; started=true;
  try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  master=actx.createGain(); master.gain.value=0; master.connect(actx.destination);
  const o1=actx.createOscillator(); o1.type='sine'; o1.frequency.value=36;
  const o2=actx.createOscillator(); o2.type='sine'; o2.frequency.value=54;
  const og=actx.createGain(); og.gain.value=0.09;
  o1.connect(og); o2.connect(og); og.connect(master); o1.start(); o2.start();
  master.gain.linearRampToValueAtTime(0, actx.currentTime);
  master.gain.linearRampToValueAtTime(0.4, actx.currentTime+4);
  try{
    const s=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    const src=actx.createMediaStreamSource(s);
    analyser=actx.createAnalyser(); analyser.fftSize=1024; analyser.smoothingTimeConstant=0.7;
    src.connect(analyser);
    const sil=actx.createGain(); sil.gain.value=0;
    analyser.connect(sil); sil.connect(actx.destination);
    micData=new Uint8Array(analyser.frequencyBinCount);
    micActive=true;
  }catch(e){}
}
function readMic(){
  if(!micActive)return;
  analyser.getByteFrequencyData(micData);
  const N=micData.length;
  let total=0,bass=0,mid=0,high=0;
  for(let i=1;i<N;i++){
    const v=micData[i]/255;
    total+=v;
    if(i<N*.12)bass+=v;
    else if(i<N*.45)mid+=v;
    else high+=v;
  }
  let e=(total/(N-1));
  e=Math.max(0,e-.022)*1.55;
  const a=.50,r=.12;
  for(const f of allBettas()){
    if(e>f.micLevel)f.micLevel+=(e-f.micLevel)*a;
    else f.micLevel+=(e-f.micLevel)*r;
    const d=e-f.micPrev;f.micPrev=e;f.micDeriv=f.micDeriv*.70+Math.max(0,d)*.30;
    f.micBass=(f.micBass||0)*.8+(bass/Math.max(1,N*.12))*.2;
    f.micMid=(f.micMid||0)*.8+(mid/Math.max(1,N*.33))*.2;
    f.micHigh=(f.micHigh||0)*.8+(high/Math.max(1,N*.55))*.2;
  }
}
function bubbleSnd(i=1,p=1){
  if(!actx) return;
  const n=actx.currentTime;
  const o=actx.createOscillator(); o.type='sine';
  o.frequency.setValueAtTime(190*p,n);
  o.frequency.exponentialRampToValueAtTime(40*p,n+0.32*i);
  const g=actx.createGain();
  g.gain.setValueAtTime(0,n);
  g.gain.linearRampToValueAtTime(0.20*i,n+0.02);
  g.gain.exponentialRampToValueAtTime(0.001,n+0.55*i);
  const bp=actx.createBiquadFilter(); bp.type='bandpass';
  bp.frequency.value=900*p; bp.Q.value=7;
  o.connect(bp); bp.connect(g); g.connect(master);
  o.start(n); o.stop(n+0.75);
}
function bubblePop(){
  if(!actx) return;
  const n=actx.currentTime;
  const o=actx.createOscillator(); o.type='sine';
  o.frequency.setValueAtTime(600+Math.random()*300,n);
  o.frequency.exponentialRampToValueAtTime(1200,n+0.05);
  const g=actx.createGain();
  g.gain.setValueAtTime(0.08,n);
  g.gain.exponentialRampToValueAtTime(0.001,n+0.08);
  o.connect(g); g.connect(master);
  o.start(n); o.stop(n+0.1);
}

/* ============================================================
   SWAMP
   ============================================================ */
let swampCanvas, plants=[], plantsFg=[], motes=[];
function buildSwamp(){
  swampCanvas=document.createElement('canvas');
  swampCanvas.width=W; swampCanvas.height=H;
  const c=swampCanvas.getContext('2d');

  /* ==========================================================
     5 PLANOS VISUALES
     5 = agua / fondo
     4 = madera y vegetación lejana
     3 = peces lejanos + plantas medias
     2 = peces medios + vegetación central
     1 = peces cercanos + alfombra frontal
     ========================================================== */

  const water=c.createLinearGradient(0,0,0,H);
  water.addColorStop(0,'#101a18');
  water.addColorStop(0.10,'#182824');
  water.addColorStop(0.28,'#17372d');
  water.addColorStop(0.52,'#102a20');
  water.addColorStop(0.76,'#0b1d15');
  water.addColorStop(1,'#050c08');
  c.fillStyle=water;
  c.fillRect(0,0,W,H);

  /* fondo difuso, sin rayos de luz */
  const haze=c.createLinearGradient(0,0,0,H*0.55);
  haze.addColorStop(0,'rgba(150,190,170,0.10)');
  haze.addColorStop(0.30,'rgba(75,125,100,0.06)');
  haze.addColorStop(1,'rgba(5,18,12,0)');
  c.fillStyle=haze;
  c.fillRect(0,0,W,H*0.65);

  /* Plano 4: masas vegetales lejanas */
  for(let i=0;i<26;i++){
    const x=W*(0.02+Math.random()*0.96);
    const base=H*(0.73+Math.random()*0.18);
    const h=H*(0.16+Math.random()*0.32);
    const col=i<14?'rgba(33,68,48,0.46)':'rgba(52,87,58,0.30)';
    c.strokeStyle=col;
    c.lineWidth=(2+Math.random()*4)*dpr;
    c.lineCap='round';
    c.beginPath();
    c.moveTo(x,base);
    c.quadraticCurveTo(
      x+(Math.random()-0.5)*45*dpr,
      base-h*0.45,
      x+(Math.random()-0.5)*70*dpr,
      base-h
    );
    c.stroke();
  }

  /* ==========================================================
     PLANO 5 — profundidad espacial
     ========================================================== */
  for(let i=0;i<42;i++){
    const x=W*(.01+Math.random()*.98);
    const base=H*(.72+Math.random()*.22);
    const h=H*(.16+Math.random()*.34);
    const sway=(Math.random()-.5)*28*dpr;
    c.strokeStyle=`rgba(${18+Math.random()*20|0},${43+Math.random()*35|0},${34+Math.random()*28|0},${.22+Math.random()*.18})`;
    c.lineWidth=(1+Math.random()*2.2)*dpr;
    c.beginPath();
    c.moveTo(x,base);
    c.quadraticCurveTo(x+sway*.35,base-h*.45,x+sway,base-h);
    c.stroke();
  }
  for(let i=0;i<70;i++){
    const x=W*(.02+Math.random()*.96);
    const y=H*(.18+Math.random()*.53);
    const rx=(5+Math.random()*14)*dpr;
    const ry=(3+Math.random()*8)*dpr;
    c.save();
    c.translate(x,y);
    c.rotate((Math.random()-.5)*1.5);
    c.fillStyle=`rgba(${20+Math.random()*24|0},${48+Math.random()*38|0},${34+Math.random()*28|0},${.10+Math.random()*.14})`;
    c.beginPath();
    c.ellipse(0,0,rx,ry,0,0,Math.PI*2);
    c.fill();
    c.restore();
  }
  for(let i=0;i<36;i++){
    const x=W*(.02+Math.random()*.96);
    const base=H*(.82+Math.random()*.10);
    const h=H*(.07+Math.random()*.17);
    c.strokeStyle=`rgba(${20+Math.random()*22|0},${52+Math.random()*42|0},${34+Math.random()*30|0},${.12+Math.random()*.13})`;
    c.lineWidth=(.7+Math.random()*1.4)*dpr;
    c.beginPath();
    c.moveTo(x,base);
    c.quadraticCurveTo(x+(Math.random()-.5)*20*dpr,base-h*.5,x+(Math.random()-.5)*34*dpr,base-h);
    c.stroke();
  }

  const farMist=c.createRadialGradient(W*.52,H*.42,0,W*.52,H*.42,W*.62);
  farMist.addColorStop(0,'rgba(70,112,96,.055)');
  farMist.addColorStop(.55,'rgba(35,70,57,.035)');
  farMist.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle=farMist;
  c.fillRect(0,0,W,H*.78);

  /* ==========================================================
     MADERA CENTRAL — estructura orgánica
     ========================================================== */
  function branch(points,width,depth,seed){
    const nSegs=points.length-1;
    const perSeg=14;
    const samples=nSegs*perSeg;
    const pts=[points[0],...points,points[points.length-1]];
    const path=[];
    for(let i=0;i<=samples;i++){
      const fi=i/perSeg;
      const idx=Math.min(nSegs-1,Math.floor(fi));
      const t=fi-idx;
      const p0=pts[idx],p1=pts[idx+1],p2=pts[idx+2],p3=pts[idx+3];
      const t2=t*t,t3=t2*t;
      path.push([
        0.5*((2*p1[0])+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),
        0.5*((2*p1[1])+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)
      ]);
    }

    const halfW=[];
    for(let i=0;i<=samples;i++){
      const t=i/samples;
      const shape=0.55+0.72*Math.sin(t*Math.PI)*Math.pow(1-Math.abs(2*t-1)*0.30,0.6);
      halfW.push(width*dpr*0.5*Math.max(0.34,shape));
    }

    const left=[],right=[];
    const upSide=[];
    for(let i=0;i<=samples;i++){
      const p=path[i];
      const pn=path[Math.min(samples,i+1)];
      const pp=path[Math.max(0,i-1)];
      const dx=pn[0]-pp[0],dy=pn[1]-pp[1];
      const len=Math.hypot(dx,dy)||1;
      const nx=-dy/len,ny=dx/len;
      left.push([p[0]+nx*halfW[i],p[1]+ny*halfW[i]]);
      right.push([p[0]-nx*halfW[i],p[1]-ny*halfW[i]]);
      let ux=nx,uy=ny;
      if(uy>0){ux=-ux;uy=-uy;}
      upSide.push([ux,uy]);
    }

    c.save();
    c.lineCap='round';
    c.lineJoin='round';

    c.beginPath();
    c.moveTo(left[0][0],left[0][1]);
    for(let i=1;i<=samples;i++)c.lineTo(left[i][0],left[i][1]);
    for(let i=samples;i>=0;i--)c.lineTo(right[i][0],right[i][1]);
    c.closePath();

    const dMul=1-(depth-2)*0.06;
    const gx0=path[0][0],gy0=path[0][1];
    const gx1=path[samples][0],gy1=path[samples][1];
    const lg=c.createLinearGradient(gx0,gy0,gx1,gy1);
    lg.addColorStop(0,   `rgba(${Math.round(94*dMul)},${Math.round(70*dMul)},${Math.round(37*dMul)},1)`);
    lg.addColorStop(0.20,`rgba(${Math.round(78*dMul)},${Math.round(55*dMul)},${Math.round(27*dMul)},1)`);
    lg.addColorStop(0.50,`rgba(${Math.round(54*dMul)},${Math.round(39*dMul)},${Math.round(20*dMul)},1)`);
    lg.addColorStop(0.80,`rgba(${Math.round(34*dMul)},${Math.round(25*dMul)},${Math.round(13*dMul)},1)`);
    lg.addColorStop(1,   `rgba(${Math.round(18*dMul)},${Math.round(13*dMul)},${Math.round(7*dMul)},1)`);
    c.fillStyle=lg;c.fill();

    c.save();
    c.clip();

    const sh=c.createLinearGradient(0,0,0,H);
    sh.addColorStop(0,   'rgba(220,190,140,0.10)');
    sh.addColorStop(0.35,'rgba(0,0,0,0)');
    sh.addColorStop(1,   'rgba(0,0,0,0.34)');
    c.fillStyle=sh;c.fillRect(0,0,W,H);

    const barkLines=20;
    for(let k=0;k<barkLines;k++){
      const offset=(Math.random()*2-1)*0.85;
      const bc=[32+Math.random()*30|0, 20+Math.random()*22|0, 9+Math.random()*12|0];
      c.strokeStyle=`rgba(${bc[0]},${bc[1]},${bc[2]},${0.20+Math.random()*0.35})`;
      c.lineWidth=(0.35+Math.random()*0.85)*dpr;
      c.beginPath();
      const startI=Math.floor(Math.random()*samples*0.45);
      const endI=Math.min(samples,startI+samples*0.45+Math.random()*samples*0.55);
      for(let i=startI;i<=endI;i++){
        const p=path[i];
        const px=p[0]+(left[i][0]-p[0])*offset + Math.sin(i*0.35+k)*1.4*dpr;
        const py=p[1]+(left[i][1]-p[1])*offset + Math.cos(i*0.28+k)*1.0*dpr;
        if(i===startI)c.moveTo(px,py);else c.lineTo(px,py);
      }
      c.stroke();
    }

    for(let k=0;k<4;k++){
      const off=-0.65-Math.random()*0.22;
      c.strokeStyle=`rgba(${155+Math.random()*50|0},${120+Math.random()*38|0},${68+Math.random()*28|0},${0.10+Math.random()*0.13})`;
      c.lineWidth=(0.65+Math.random()*0.7)*dpr;
      c.beginPath();
      for(let i=0;i<=samples;i++){
        const p=path[i];
        const px=p[0]+(left[i][0]-p[0])*off;
        const py=p[1]+(left[i][1]-p[1])*off;
        if(i===0)c.moveTo(px,py);else c.lineTo(px,py);
      }
      c.stroke();
    }
    for(let k=0;k<3;k++){
      const off=0.65+Math.random()*0.22;
      c.strokeStyle=`rgba(10,6,3,${0.22+Math.random()*0.18})`;
      c.lineWidth=(0.7+Math.random()*0.85)*dpr;
      c.beginPath();
      for(let i=0;i<=samples;i++){
        const p=path[i];
        const px=p[0]+(left[i][0]-p[0])*off;
        const py=p[1]+(left[i][1]-p[1])*off;
        if(i===0)c.moveTo(px,py);else c.lineTo(px,py);
      }
      c.stroke();
    }

    const knotCount=2+Math.floor(Math.random()*3);
    for(let kk=0;kk<knotCount;kk++){
      const ki=Math.floor(samples*(0.15+Math.random()*0.70));
      const p=path[ki];
      const kr=(3.2+Math.random()*5.5)*dpr;
      const kg=c.createRadialGradient(p[0],p[1],0,p[0],p[1],kr*1.9);
      kg.addColorStop(0,   'rgba(6,4,2,0.85)');
      kg.addColorStop(0.35,'rgba(28,18,9,0.55)');
      kg.addColorStop(1,   'rgba(20,14,7,0)');
      c.fillStyle=kg;
      c.beginPath();
      c.ellipse(p[0],p[1],kr*1.9,kr*1.25,0,0,Math.PI*2);
      c.fill();
      for(let rr=0;rr<3;rr++){
        c.strokeStyle=`rgba(${85+Math.random()*30|0},${62+Math.random()*24|0},${30+Math.random()*14|0},${0.28+Math.random()*0.24})`;
        c.lineWidth=0.5*dpr;
        c.beginPath();
        c.ellipse(p[0],p[1],kr*(0.30+rr*0.42),kr*(0.18+rr*0.30),0,0,Math.PI*2);
        c.stroke();
      }
      c.fillStyle='rgba(0,0,0,0.72)';
      c.beginPath();
      c.ellipse(p[0],p[1],kr*0.28,kr*0.18,0,0,Math.PI*2);
      c.fill();
    }

    const mossN=(depth<=2)?Math.floor(samples*0.55):(depth<=3?Math.floor(samples*0.30):0);
    for(let i=0;i<mossN;i++){
      const idx=Math.floor(Math.random()*samples);
      const p=path[idx];
      const ux=upSide[idx][0],uy=upSide[idx][1];
      const mx=p[0]+ux*halfW[idx]*(0.78+Math.random()*0.25);
      const my=p[1]+uy*halfW[idx]*(0.78+Math.random()*0.25);
      const rr=(1.0+Math.random()*3.2)*dpr;
      c.fillStyle=`rgba(${25+Math.random()*35|0},${62+Math.random()*55|0},${22+Math.random()*26|0},${0.30+Math.random()*0.38})`;
      c.beginPath();
      c.arc(mx,my,rr,0,Math.PI*2);
      c.fill();
    }

    c.restore();
    c.restore();
  }

  const trunkX=W*0.50;
  branch([
    [W*0.48,H*0.91],[W*0.49,H*0.75],[W*0.46,H*0.61],[W*0.43,H*0.48],
    [W*0.31,H*0.38],[W*0.16,H*0.31],[W*0.04,H*0.38]
  ],31,4,1);
  branch([
    [W*0.49,H*0.76],[W*0.57,H*0.60],[W*0.66,H*0.50],[W*0.73,H*0.36],
    [W*0.78,H*0.20]
  ],25,4,2);
  branch([
    [W*0.46,H*0.60],[W*0.39,H*0.48],[W*0.33,H*0.28],[W*0.27,H*0.11],
    [W*0.22,H*0.02]
  ],21,4,3);
  branch([
    [W*0.54,H*0.63],[W*0.60,H*0.48],[W*0.66,H*0.27],[W*0.62,H*0.10],
    [W*0.58,H*0.01]
  ],19,4,4);
  branch([
    [W*0.48,H*0.80],[W*0.38,H*0.73],[W*0.27,H*0.68],[W*0.15,H*0.69],
    [W*0.07,H*0.76]
  ],17,3,5);
  branch([
    [W*0.53,H*0.78],[W*0.65,H*0.77],[W*0.77,H*0.80],[W*0.90,H*0.83]
  ],15,3,6);

  branch([
    [W*0.50,H*0.82],[W*0.44,H*0.86],[W*0.36,H*0.91],[W*0.26,H*0.94]
  ],11,2,7);
  branch([
    [W*0.54,H*0.82],[W*0.62,H*0.88],[W*0.73,H*0.91],[W*0.84,H*0.94]
  ],10,2,8);

  const shadow=c.createRadialGradient(W*0.50,H*0.72,5,W*0.50,H*0.72,W*0.32);
  shadow.addColorStop(0,'rgba(0,0,0,0.38)');
  shadow.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle=shadow;
  c.fillRect(0,0,W,H);

  /* ==========================================================
     SUSTRATO — capas reales de acuario plantado
     ========================================================== */
  const floorY=H*0.91;

  const sg=c.createLinearGradient(0,floorY-40*dpr,0,H);
  sg.addColorStop(0,'#1e2615');
  sg.addColorStop(0.25,'#16200f');
  sg.addColorStop(0.7,'#0c1409');
  sg.addColorStop(1,'#050805');
  c.fillStyle=sg;
  c.fillRect(0,floorY-40*dpr,W,H-floorY+40*dpr);

  c.save();
  c.beginPath();
  c.moveTo(0,floorY);
  for(let i=0;i<=60;i++){
    const x=W*i/60;
    const y=floorY+(Math.sin(i*0.7)*3 + Math.sin(i*2.3)*1.8 + (Math.random()-0.5)*2.5)*dpr;
    c.lineTo(x,y);
  }
  c.lineTo(W,H); c.lineTo(0,H); c.closePath();
  c.clip();

  for(let i=0;i<180;i++){
    const x=Math.random()*W;
    const y=floorY+2*dpr+Math.random()*(H-floorY-4*dpr);
    const rr=(2.2+Math.random()*4.5)*dpr;
    const tone=Math.random();
    const col = tone<0.4
      ? `rgba(${52+Math.random()*35|0},${48+Math.random()*28|0},${30+Math.random()*20|0},${0.55+Math.random()*0.35})`
      : tone<0.75
      ? `rgba(${38+Math.random()*28|0},${34+Math.random()*22|0},${22+Math.random()*16|0},${0.55+Math.random()*0.35})`
      : `rgba(${72+Math.random()*35|0},${66+Math.random()*28|0},${42+Math.random()*22|0},${0.45+Math.random()*0.30})`;
    c.fillStyle=col;
    c.beginPath();
    const sides=5+Math.floor(Math.random()*3);
    for(let k=0;k<sides;k++){
      const a=k*Math.PI*2/sides + Math.random()*0.25;
      const r=rr*(0.72+Math.random()*0.42);
      const px=x+Math.cos(a)*r, py=y+Math.sin(a)*r*0.75;
      if(k===0)c.moveTo(px,py);else c.lineTo(px,py);
    }
    c.closePath();c.fill();
    c.fillStyle=`rgba(200,190,160,${0.05+Math.random()*0.10})`;
    c.beginPath();c.arc(x-rr*0.28,y-rr*0.30,rr*0.30,0,Math.PI*2);c.fill();
  }

  for(let i=0;i<2200;i++){
    const x=Math.random()*W;
    const y=floorY+(Math.random()*(H-floorY));
    const rr=(0.35+Math.random()*1.1)*dpr;
    c.fillStyle=`rgba(${22+Math.random()*42|0},${20+Math.random()*34|0},${10+Math.random()*22|0},${0.35+Math.random()*0.5})`;
    c.beginPath();c.arc(x,y,rr,0,Math.PI*2);c.fill();
  }

  for(let i=0;i<70;i++){
    const x=Math.random()*W;
    const y=floorY+4*dpr+Math.random()*(H-floorY-8*dpr);
    const rot=(Math.random()-0.5)*1.2;
    c.save();c.translate(x,y);c.rotate(rot);
    const kind=Math.random();
    if(kind<0.55){
      const w=(4+Math.random()*10)*dpr, h=(1.5+Math.random()*2.8)*dpr;
      c.fillStyle=`rgba(${58+Math.random()*35|0},${38+Math.random()*22|0},${16+Math.random()*12|0},${0.5+Math.random()*0.35})`;
      c.beginPath();c.ellipse(0,0,w,h,0,0,Math.PI*2);c.fill();
      c.strokeStyle=`rgba(20,12,6,0.55)`;c.lineWidth=0.4*dpr;
      c.beginPath();c.moveTo(-w*0.85,0);c.lineTo(w*0.85,0);c.stroke();
    } else if(kind<0.85){
      const w=(6+Math.random()*14)*dpr;
      c.strokeStyle=`rgba(${40+Math.random()*24|0},${26+Math.random()*14|0},${12+Math.random()*10|0},${0.55+Math.random()*0.3})`;
      c.lineWidth=(0.6+Math.random()*0.9)*dpr;
      c.beginPath();c.moveTo(-w/2,0);c.quadraticCurveTo(0,(Math.random()-0.5)*2*dpr,w/2,0);c.stroke();
    } else {
      const rr=(1.4+Math.random()*2)*dpr;
      c.fillStyle=`rgba(${48+Math.random()*24|0},${32+Math.random()*18|0},${14+Math.random()*10|0},0.7)`;
      c.beginPath();c.ellipse(0,0,rr*1.6,rr*0.8,0,0,Math.PI*2);c.fill();
    }
    c.restore();
  }

  c.restore();

  const contact=c.createLinearGradient(0,floorY-8*dpr,0,floorY+6*dpr);
  contact.addColorStop(0,'rgba(0,0,0,0)');
  contact.addColorStop(1,'rgba(0,0,0,0.55)');
  c.fillStyle=contact;
  c.fillRect(0,floorY-8*dpr,W,14*dpr);

  /* ==========================================================
     ALFOMBRA DELANTERA — Rosetas individuales
     ========================================================== */
  for(let i=0;i<140;i++){
    const x=W*(0.01+Math.random()*0.98);
    const y=H*(0.90+Math.random()*0.10);
    const depthT=(y-H*0.90)/(H*0.10);
    const scale=0.7+depthT*0.9;
    const rosetteR=(2.5+Math.random()*3.5)*dpr*scale;

    const nLeaf=4+Math.floor(Math.random()*5);
    for(let k=0;k<nLeaf;k++){
      const a=k*Math.PI*2/nLeaf + Math.random()*0.35;
      const lx=x+Math.cos(a)*rosetteR*0.42;
      const ly=y+Math.sin(a)*rosetteR*0.30 - Math.random()*1.5*dpr;
      const lw=rosetteR*(0.75+Math.random()*0.35);
      const lh=rosetteR*(0.28+Math.random()*0.16);
      const youngness=1-k/nLeaf;
      const gcol = youngness>0.5
        ? `rgba(${95+Math.random()*45|0},${155+Math.random()*55|0},${58+Math.random()*40|0},${0.55+Math.random()*0.30})`
        : `rgba(${55+Math.random()*35|0},${115+Math.random()*45|0},${42+Math.random()*32|0},${0.45+Math.random()*0.35})`;
      c.save();c.translate(lx,ly);c.rotate(a*1.05);
      c.fillStyle=gcol;
      c.beginPath();
      c.moveTo(-lw,0);
      c.quadraticCurveTo(-lw*0.2,-lh*1.5,lw*0.85,-lh*0.25);
      c.quadraticCurveTo(lw*1.05,0,lw*0.85,lh*0.25);
      c.quadraticCurveTo(-lw*0.2,lh*1.5,-lw,0);
      c.closePath();c.fill();
      c.strokeStyle=`rgba(20,40,18,0.30)`;
      c.lineWidth=0.35*dpr;
      c.beginPath();c.moveTo(-lw*0.85,0);c.lineTo(lw*0.75,0);c.stroke();
      c.restore();
    }
  }

  /* ==========================================================
     MASA VEGETAL DERECHA — más densa, 220 items, 4 tonos de verde
     ========================================================== */
  const rightSpecies = ['vallis','sagitt','stem','vallis','sagitt','vallis','vallis','sagitt'];

  for(let i=0;i<220;i++){
    const x=W*(0.55+Math.random()*0.44);
    const base=H*(0.86+Math.random()*0.12);
    const kind=rightSpecies[Math.floor(Math.random()*rightSpecies.length)];
    const tintBias=Math.random();

    if(kind==='vallis'){
      const h=H*(0.18+Math.random()*0.46);
      const lean=(Math.random()-0.5)*95*dpr;
      const curlA=(Math.random()-0.5)*1.4;
      const w=(2.0+Math.random()*3.0)*dpr;
      const g=c.createLinearGradient(x,base,x+lean,base-h);
      if(tintBias<0.25){
        g.addColorStop(0,`rgba(18,52,30,0.82)`);
        g.addColorStop(0.6,`rgba(48,102,44,0.78)`);
        g.addColorStop(1,`rgba(96,158,62,0.75)`);
      } else if(tintBias<0.55){
        g.addColorStop(0,`rgba(24,64,34,0.82)`);
        g.addColorStop(0.6,`rgba(62,120,52,0.78)`);
        g.addColorStop(1,`rgba(120,178,74,0.75)`);
      } else if(tintBias<0.8){
        g.addColorStop(0,`rgba(30,72,40,0.82)`);
        g.addColorStop(0.6,`rgba(78,138,58,0.78)`);
        g.addColorStop(1,`rgba(148,198,86,0.75)`);
      } else {
        g.addColorStop(0,`rgba(42,80,40,0.82)`);
        g.addColorStop(0.6,`rgba(94,148,62,0.78)`);
        g.addColorStop(1,`rgba(170,208,102,0.75)`);
      }
      c.strokeStyle=g;
      c.lineCap='round';
      c.beginPath();
      c.moveTo(x-w*0.5,base);
      c.bezierCurveTo(x+lean*0.15,base-h*0.35, x+lean*0.65,base-h*0.72, x+lean,base-h);
      c.bezierCurveTo(x+lean*0.65+curlA*4*dpr,base-h*0.70, x+lean*0.15+curlA*6*dpr,base-h*0.32, x+w*0.5,base);
      c.closePath();
      c.fillStyle=g;c.fill();
      c.strokeStyle=`rgba(12,30,16,0.38)`;c.lineWidth=0.4*dpr;
      for(let v=-1;v<=1;v++){
        c.beginPath();
        c.moveTo(x+v*0.6*dpr,base);
        c.quadraticCurveTo(x+lean*0.5+v*0.8*dpr,base-h*0.55,x+lean+v*0.4*dpr,base-h);
        c.stroke();
      }
    } else if(kind==='sagitt'){
      const h=H*(0.12+Math.random()*0.26);
      const lean=(Math.random()-0.5)*65*dpr;
      const wid=(4+Math.random()*5)*dpr;
      const g=c.createLinearGradient(x,base,x+lean,base-h);
      g.addColorStop(0,`rgba(22,56,32,0.82)`);
      g.addColorStop(0.5,`rgba(62,116,50,0.78)`);
      g.addColorStop(1,`rgba(128,178,72,0.75)`);
      c.fillStyle=g;
      c.beginPath();
      c.moveTo(x-wid,base);
      c.quadraticCurveTo(x-wid*0.3,base-h*0.55, x+lean,base-h);
      c.quadraticCurveTo(x+wid*0.3,base-h*0.55, x+wid,base);
      c.closePath();c.fill();
      c.strokeStyle=`rgba(12,30,16,0.34)`;c.lineWidth=0.4*dpr;
      c.beginPath();c.moveTo(x,base);c.lineTo(x+lean,base-h);c.stroke();
    } else {
      const h=H*(0.16+Math.random()*0.32);
      const lean=(Math.random()-0.5)*45*dpr;
      c.strokeStyle=`rgba(${30+Math.random()*32|0},${72+Math.random()*55|0},${34+Math.random()*34|0},0.78)`;
      c.lineWidth=(1+Math.random()*1.4)*dpr;
      c.beginPath();c.moveTo(x,base);c.quadraticCurveTo(x+lean*0.5,base-h*0.5,x+lean,base-h);c.stroke();
      const nL=5+Math.floor(Math.random()*5);
      for(let k=1;k<=nL;k++){
        const t=k/(nL+1);
        const cx=x+lean*t+Math.sin(t*3)*2*dpr;
        const cy=base-h*t;
        const dir=k%2?1:-1;
        const gcol=Math.random()<0.4
          ? `rgba(${78+Math.random()*45|0},${132+Math.random()*50|0},${58+Math.random()*30|0},0.78)`
          : `rgba(${48+Math.random()*30|0},${100+Math.random()*42|0},${44+Math.random()*26|0},0.78)`;
        c.fillStyle=gcol;
        c.beginPath();c.ellipse(cx+dir*3.5*dpr,cy,4.2*dpr,1.7*dpr,dir*0.45,0,Math.PI*2);c.fill();
      }
    }
  }

  /* ==========================================================
     ANUBIAS SOBRE EL TRONCO — racimos orgánicos anclados a nudos
     ========================================================== */
  const anubiasAnchors=[
    {x:.48,y:.82},{x:.46,y:.72},{x:.44,y:.62},
    {x:.42,y:.52},{x:.40,y:.44},{x:.44,y:.36},
    {x:.55,y:.60},{x:.62,y:.48},{x:.66,y:.38},
    {x:.36,y:.42},{x:.30,y:.32},{x:.30,y:.24},
    {x:.58,y:.72},{x:.68,y:.68},{x:.74,y:.55},
    {x:.34,y:.60},{x:.28,y:.55},{x:.52,y:.88}
  ];
  for(const anchor of anubiasAnchors){
    const cx=W*anchor.x, cy=H*anchor.y;
    const nLeaf=6+Math.floor(Math.random()*7);
    for(let k=0;k<nLeaf;k++){
      const a=Math.random()*Math.PI*2;
      const r=Math.pow(Math.random(),0.6)*26*dpr;
      const bx=cx+Math.cos(a)*r;
      const by=cy+Math.sin(a)*r*0.7;

      const aboveBias=(cy-by)/(26*dpr);
      const outBias=bx<cx?-1:1;
      let ang;
      if(aboveBias>0.35){
        ang = -Math.PI*0.5 + outBias*0.3 + (Math.random()-0.5)*0.9;
      } else if(aboveBias<-0.35){
        ang = Math.PI*0.5 + outBias*0.4 + (Math.random()-0.5)*0.8;
      } else {
        ang = outBias>0 ? (Math.random()-0.5)*1.6 : Math.PI + (Math.random()-0.5)*1.6;
      }

      const young=Math.random()<0.35;
      const sz = young
        ? (3.5+Math.random()*4.5)*dpr
        : (7+Math.random()*11)*dpr;

      const palette = young
        ? ['rgba(120,190,80,','rgba(140,210,90,','rgba(100,175,70,','rgba(160,220,110,']
        : ['rgba(28,72,38,','rgba(38,88,44,','rgba(48,105,50,','rgba(62,125,56,','rgba(78,145,66,','rgba(22,58,32,','rgba(90,155,72,'];
      const col=palette[Math.floor(Math.random()*palette.length)];
      const alpha=young ? 0.55+Math.random()*0.35 : 0.55+Math.random()*0.40;

      c.save();
      c.translate(bx,by);
      c.rotate(ang);

      const petLen = young ? sz*0.35 : sz*0.55;
      c.strokeStyle=`rgba(${45+Math.random()*25|0},${85+Math.random()*35|0},${38+Math.random()*22|0},0.85)`;
      c.lineWidth=(0.8+Math.random()*0.6)*dpr;
      c.beginPath();
      c.moveTo(0,0);
      c.quadraticCurveTo(petLen*0.55, sz*0.10, petLen, sz*0.05);
      c.stroke();

      const widthMul = 0.55 + Math.random()*0.15;
      const lengthMul = 0.95 + Math.random()*0.25;
      c.fillStyle=`${col}${alpha})`;
      c.beginPath();
      c.moveTo(petLen, sz*0.05);
      c.bezierCurveTo(
        petLen + sz*0.45, -sz*widthMul,
        petLen + sz*1.55*lengthMul, -sz*widthMul*0.95,
        petLen + sz*1.85*lengthMul, -sz*0.05
      );
      c.bezierCurveTo(
        petLen + sz*1.55*lengthMul, sz*widthMul*0.95,
        petLen + sz*0.45, sz*widthMul,
        petLen, sz*0.05
      );
      c.closePath();
      c.fill();

      c.strokeStyle=`rgba(12,30,15,0.48)`;
      c.lineWidth=0.5*dpr;
      c.beginPath();
      c.moveTo(petLen, sz*0.05);
      c.quadraticCurveTo(petLen + sz*0.9, -sz*0.05, petLen + sz*1.7*lengthMul, -sz*0.05);
      c.stroke();

      for(let v=0;v<3;v++){
        const vt=0.30+v*0.22;
        c.strokeStyle=`rgba(12,30,15,0.30)`;
        c.lineWidth=0.35*dpr;
        const nx=petLen + sz*(0.35+vt*1.1)*lengthMul;
        c.beginPath();
        c.moveTo(nx, sz*0.02);
        c.quadraticCurveTo(nx + sz*0.15, -sz*0.22, nx + sz*0.28, -sz*0.30*widthMul*1.5);
        c.stroke();
        c.beginPath();
        c.moveTo(nx, sz*0.02);
        c.quadraticCurveTo(nx + sz*0.15, sz*0.20, nx + sz*0.26, sz*0.28*widthMul*1.5);
        c.stroke();
      }

      c.fillStyle=`rgba(210,245,190,${0.08+Math.random()*0.12})`;
      c.beginPath();
      c.ellipse(petLen + sz*1.0, -sz*0.22, sz*0.30, sz*0.09, -0.2, 0, Math.PI*2);
      c.fill();

      c.restore();
    }
  }

  /* ==========================================================
     DIVERSIDAD BOTÁNICA
     Musgo real (filamentos), Vallisneria en grupos,
     Cryptocoryne en roseta, rocas tapizadas.
     ========================================================== */

  const mossZones=[
    {x0:W*0.10,y0:H*0.55,x1:W*0.90,y1:H*0.85,density:260},
    {x0:W*0.28,y0:H*0.32,x1:W*0.72,y1:H*0.55,density:120},
    {x0:W*0.05,y0:H*0.80,x1:W*0.95,y1:H*0.94,density:180}
  ];
  for(const zone of mossZones){
    for(let i=0;i<zone.density;i++){
      const bx=zone.x0+Math.random()*(zone.x1-zone.x0);
      const by=zone.y0+Math.random()*(zone.y1-zone.y0);
      const nF=2+Math.floor(Math.random()*3);
      for(let f=0;f<nF;f++){
        const a=Math.random()*Math.PI*2;
        const len=(3+Math.random()*7)*dpr;
        const curve=(Math.random()-0.5)*0.9;
        c.strokeStyle=`rgba(${28+Math.random()*38|0},${68+Math.random()*60|0},${30+Math.random()*32|0},${0.32+Math.random()*0.38})`;
        c.lineWidth=(0.5+Math.random()*0.8)*dpr;
        c.lineCap='round';
        c.beginPath();
        c.moveTo(bx,by);
        c.quadraticCurveTo(
          bx+Math.cos(a)*len*0.5+curve*4*dpr,
          by+Math.sin(a)*len*0.5+curve*3*dpr,
          bx+Math.cos(a)*len,
          by+Math.sin(a)*len
        );
        c.stroke();
      }
    }
  }

  /* --- Vallisneria: grupos vivos con gradiente real y curvas cruzadas --- */
  for(let g=0;g<26;g++){
    const gx=W*(0.02+Math.random()*0.96);
    const gy=H*(0.89+Math.random()*0.06);
    const n=8+Math.floor(Math.random()*8);
    const groupHue=80+Math.random()*45;
    for(let k=0;k<n;k++){
      const h=H*(0.08+Math.random()*0.34);
      const lean=(Math.random()-0.5)*90*dpr;
      const w=(1.4+Math.random()*2.2)*dpr;
      const curl=(Math.random()-0.5)*10*dpr;

      const lBias=Math.random();
      let colBase, colMid, colTip;
      if(lBias<0.30){
        colBase=`hsla(${groupHue+15},${42+Math.random()*20}%,${22+Math.random()*8}%,0.75)`;
        colMid =`hsla(${groupHue+18},${48+Math.random()*20}%,${38+Math.random()*10}%,0.78)`;
        colTip =`hsla(${groupHue+20},${55+Math.random()*20}%,${62+Math.random()*10}%,0.78)`;
      } else if(lBias<0.75){
        colBase=`hsla(${groupHue},${38+Math.random()*20}%,${16+Math.random()*8}%,0.80)`;
        colMid =`hsla(${groupHue+4},${42+Math.random()*20}%,${30+Math.random()*10}%,0.78)`;
        colTip =`hsla(${groupHue+6},${50+Math.random()*20}%,${52+Math.random()*10}%,0.76)`;
      } else {
        colBase=`hsla(${groupHue-10},${32+Math.random()*16}%,${10+Math.random()*6}%,0.82)`;
        colMid =`hsla(${groupHue-6},${36+Math.random()*16}%,${22+Math.random()*8}%,0.78)`;
        colTip =`hsla(${groupHue-2},${42+Math.random()*18}%,${42+Math.random()*10}%,0.74)`;
      }

      const lg=c.createLinearGradient(gx,gy,gx+lean,gy-h);
      lg.addColorStop(0, colBase);
      lg.addColorStop(0.55, colMid);
      lg.addColorStop(1, colTip);

      c.fillStyle=lg;
      c.beginPath();
      c.moveTo(gx-w,gy);
      c.quadraticCurveTo(
        gx+lean*0.45-w*0.5+curl*0.4, gy-h*0.55,
        gx+lean, gy-h
      );
      c.quadraticCurveTo(
        gx+lean*0.55+w*0.5+curl*0.5, gy-h*0.55,
        gx+w, gy
      );
      c.closePath();
      c.fill();

      c.strokeStyle=`hsla(${groupHue},${30}%,${12}%,0.32)`;
      c.lineWidth=0.35*dpr;
      c.beginPath();
      c.moveTo(gx,gy);
      c.quadraticCurveTo(gx+lean*0.5,gy-h*0.55,gx+lean,gy-h);
      c.stroke();

      if(Math.random()<0.25){
        c.strokeStyle=`hsla(${groupHue+30},70%,${75}%,${0.10+Math.random()*0.12})`;
        c.lineWidth=0.4*dpr;
        c.beginPath();
        c.moveTo(gx+lean*0.5, gy-h*0.55);
        c.quadraticCurveTo(gx+lean*0.75, gy-h*0.75, gx+lean*0.9, gy-h*0.92);
        c.stroke();
      }
    }
  }

  for(let g=0;g<22;g++){
    const gx=W*(0.03+Math.random()*0.94);
    const gy=H*(0.88+Math.random()*0.08);
    const n=5+Math.floor(Math.random()*4);
    for(let k=0;k<n;k++){
      const a=(k/n)*Math.PI*2 + Math.random()*0.4;
      const len=(5+Math.random()*11)*dpr;
      const wid=(2.5+Math.random()*2.5)*dpr;
      const hcol=Math.random()<0.35
        ? `rgba(${95+Math.random()*40|0},${70+Math.random()*30|0},${42+Math.random()*20|0},${0.55+Math.random()*0.30})`
        : `rgba(${40+Math.random()*30|0},${90+Math.random()*55|0},${45+Math.random()*35|0},${0.50+Math.random()*0.35})`;
      c.save();
      c.translate(gx,gy);
      c.rotate(a*0.55);
      c.fillStyle=hcol;
      c.beginPath();
      c.moveTo(0,0);
      c.bezierCurveTo(wid,-len*0.35, wid*0.5,-len*0.85, 0,-len);
      c.bezierCurveTo(-wid*0.5,-len*0.85, -wid,-len*0.35, 0,0);
      c.closePath();c.fill();
      c.strokeStyle=`rgba(15,32,18,0.38)`;c.lineWidth=0.4*dpr;
      for(let v=-1;v<=1;v++){
        c.beginPath();
        c.moveTo(0,0);
        c.quadraticCurveTo(v*wid*0.5,-len*0.55, v*wid*0.15,-len*0.95);
        c.stroke();
      }
      c.restore();
    }
  }

  for(let r=0;r<10;r++){
    const rx=W*(0.04+Math.random()*0.92);
    const ry=H*(0.90+Math.random()*0.06);
    const rr=(9+Math.random()*20)*dpr;
    c.fillStyle=`rgba(${28+Math.random()*20|0},${26+Math.random()*16|0},${18+Math.random()*12|0},0.85)`;
    c.beginPath();
    const sides=6+Math.floor(Math.random()*3);
    for(let s=0;s<sides;s++){
      const a=s*Math.PI*2/sides;
      const r2=rr*(0.75+Math.random()*0.35);
      const px=rx+Math.cos(a)*r2, py=ry+Math.sin(a)*r2*0.65;
      if(s===0)c.moveTo(px,py);else c.lineTo(px,py);
    }
    c.closePath();c.fill();
    c.fillStyle=`rgba(180,190,160,0.10)`;
    c.beginPath();c.arc(rx-rr*0.25,ry-rr*0.35,rr*0.42,0,Math.PI*2);c.fill();
    const nF=10+Math.floor(Math.random()*12);
    for(let f=0;f<nF;f++){
      const a=Math.random()*Math.PI*2;

function drawPlantsSet(t, set, alphaMul){

      ctx.strokeStyle=g; ctx.lineWidth=bl.width; ctx.lineCap='round';
      ctx.beginPath();
      ctx.moveTo(cl.x+bl.ox,cl.y);
      ctx.quadraticCurveTo(midX,midY,tipX,tipY);

/* ============================================================
   SPINE
   ============================================================ */
class Spine{
  constructor(len,n){
    this.len=len; this.n=n;
    this.pts=[];
    for(let i=0;i<n;i++) this.pts.push({x:0,y:0,a:0});
  }
  update(x,y,headAngle,wave,time,curvFn){
    const seg=this.len/(this.n-1);
    this.pts[0].x=x; this.pts[0].y=y; this.pts[0].a=headAngle;
    for(let i=1;i<this.n;i++){
      const s=i/(this.n-1);
      const env=0.02+0.98*Math.pow(s,2.0);
      let k=wave.amp*env*Math.sin(2*Math.PI*(wave.freq*time - s*wave.wavelength));
      if(curvFn) k+=curvFn(s,time);
      this.pts[i].a=this.pts[i-1].a+k;
      this.pts[i].x=this.pts[i-1].x-Math.cos(this.pts[i-1].a)*seg;
      this.pts[i].y=this.pts[i-1].y-Math.sin(this.pts[i-1].a)*seg;
    }
  }
}

/* ============================================================
   RAY FIN
   ============================================================ */
class RayFin{
  constructor(nRays,nSegs,len,fanAngle){
    this.nRays=nRays; this.nSegs=nSegs;
    this.baseLen=len; this.baseFan=fanAngle;
    this.rays=[];
    for(let r=0;r<nRays;r++){
      const s=[];
      for(let k=0;k<nSegs;k++) s.push({x:0,y:0,vx:0,vy:0});
      this.rays.push(s);
    }
    this.ext=0.4; this.extV=0;
    this.init=false;
    this.lenScale=1.0; this.fanScale=1.0;
  }
  update(baseX,baseY,baseAngle,flow,opts){
    const k=6.0,damp=3.0;
    this.extV+=(opts.targetExt-this.ext)*k*opts.dt;
    this.extV*=Math.exp(-damp*opts.dt);
    this.ext+=this.extV*opts.dt;
    this.ext=Math.max(0,Math.min(1,this.ext));
    const fanNow=this.baseFan*this.fanScale*(0.10+0.90*this.ext);
    const lenNow=this.baseLen*this.lenScale*(0.35+0.65*this.ext);
    const segLen=lenNow/(this.nSegs-1);
    const tension=0.28+0.55*this.ext;
    const dragK=opts.dragK;
    for(let r=0;r<this.nRays;r++){
      const ray=this.rays[r];
      const fanT=this.nRays>1?(r/(this.nRays-1)-0.5):0;
      const rayAng=baseAngle+fanT*fanNow;
      const bx=baseX+Math.cos(baseAngle+Math.PI/2)*fanT*this.baseFan*6*dpr*opts.spread;
      const by=baseY+Math.sin(baseAngle+Math.PI/2)*fanT*this.baseFan*6*dpr*opts.spread;
      ray[0].x=bx; ray[0].y=by; ray[0].vx=0; ray[0].vy=0;
      if(!this.init){
        for(let s=0;s<this.nSegs;s++){
          ray[s].x=bx+Math.cos(rayAng)*segLen*s;
          ray[s].y=by+Math.sin(rayAng)*segLen*s;
        }
      }
      for(let s=1;s<this.nSegs;s++){
        const p=ray[s],prev=ray[s-1];
        const dx=p.x-prev.x,dy=p.y-prev.y;
        const d=Math.hypot(dx,dy)||0.001;
        const nx=dx/d,ny=dy/d;
        const sN=s/(this.nSegs-1);
        const wp=opts.time*opts.waveFreq+r*0.42+sN*3.2;
        const waveAng=rayAng+Math.sin(wp)*opts.waveAmp*sN;
        const tx=Math.cos(waveAng),ty=Math.sin(waveAng);
        let fx=(tx-nx)*tension;
        let fy=(ty-ny)*tension;
        const le=d-segLen;
        fx+=-nx*le*0.32; fy+=-ny*le*0.32;
        fx+=flow.x*dragK; fy+=flow.y*dragK;
        fy-=0.006;
        p.vx=(p.vx+fx)*0.88; p.vy=(p.vy+fy)*0.88;
        const sp=Math.hypot(p.vx,p.vy);
        const maxSp=3.2*dpr;
        if(sp>maxSp){ p.vx*=maxSp/sp; p.vy*=maxSp/sp; }
        p.x+=p.vx; p.y+=p.vy;
        const ndx=p.x-prev.x,ndy=p.y-prev.y;
        const nd=Math.hypot(ndx,ndy)||0.0001;
        const cl=Math.max(segLen*0.80,Math.min(segLen*1.20,nd));
        if(Math.abs(cl-nd)>0.0005){
          const cx=ndx/nd,cy=ndy/nd;
          p.x=prev.x+cx*cl; p.y=prev.y+cy*cl;
          const vr=p.vx*cx+p.vy*cy;
          p.vx-=cx*vr*0.5; p.vy-=cy*vr*0.5;
        }
      }
    }
    this.init=true;
  }
  draw(edgeCol,memCol,alphaScale,highlight,alphaMul){
    const aS=(alphaScale!=null?alphaScale:1)*(alphaMul!=null?alphaMul:1);
    for(let r=0;r<this.nRays-1;r++){
      const a=this.rays[r],b=this.rays[r+1];
      ctx.beginPath();
      for(let s=0;s<this.nSegs;s++) ctx.lineTo(a[s].x,a[s].y);
      for(let s=this.nSegs-1;s>=0;s--) ctx.lineTo(b[s].x,b[s].y);
      ctx.closePath();
      const fanT=r/(this.nRays-1);
      const memb=0.22+0.16*Math.sin(fanT*Math.PI);
      ctx.fillStyle=memCol; ctx.globalAlpha=memb*aS; ctx.fill();
      if(highlight){
        ctx.globalAlpha=memb*aS*0.30;
        ctx.fillStyle='rgba(255,220,220,0.4)';
        ctx.fill();
      }
    }
    ctx.strokeStyle=edgeCol;
    ctx.lineWidth=0.65*dpr;
    ctx.globalAlpha=0.70*aS;
    ctx.lineCap='round';
    for(let r=0;r<this.nRays;r++){
      const ray=this.rays[r];
      ctx.beginPath(); ctx.moveTo(ray[0].x,ray[0].y);
      for(let s=1;s<this.nSegs;s++){
        const mx=(ray[s].x+ray[s-1].x)/2;
        const my=(ray[s].y+ray[s-1].y)/2;
        ctx.quadraticCurveTo(ray[s-1].x,ray[s-1].y,mx,my);
      }
      ctx.stroke();
    }
    ctx.globalAlpha=1;
  }
}

/* ============================================================
   ARTEMIA — confinada a la banda de nado
   ============================================================ */
class Artemia{
  constructor(x,y){
    this.x=x; this.y=y;
    this.angle=Math.random()*Math.PI*2;
    this.phase=Math.random()*Math.PI*2;
    this.speed=0.35+Math.random()*0.5;
    this.r=1.9*dpr;
    this.eaten=false;
    this.wobble=Math.random()*Math.PI*2;
  }
  update(dt,t){
    this.angle += Math.sin(t*4+this.phase)*0.18*dt;
    this.wobble += dt*5;
    const sp=this.speed*dpr*60*dt*0.55;
    this.x += Math.cos(this.angle)*sp;
    this.y += Math.sin(this.angle)*sp;
    this.y -= 0.06*dpr*60*dt*0.55;

    const topY = H*SWIM_BAND.topFrac + 15*dpr;
    const botY = H*WATER_FLOOR_FRAC - 12*dpr;
    if(this.x<20*dpr){this.x=20*dpr; this.angle=Math.PI-this.angle;}
    if(this.x>W-20*dpr){this.x=W-20*dpr; this.angle=Math.PI-this.angle;}
    if(this.y<topY){ this.y=topY; this.angle=-this.angle; }
    if(this.y>botY){ this.y=botY; this.angle=-this.angle; }
  }
  draw(t){
    const wig=Math.sin(this.wobble)*0.6;
    const tx=this.x-Math.cos(this.angle)*this.r*2.0;
    const ty=this.y-Math.sin(this.angle)*this.r*2.0;
    ctx.strokeStyle='rgba(220,150,80,0.55)';
    ctx.lineWidth=0.65*dpr;
    ctx.beginPath();
    ctx.moveTo(this.x,this.y);
    ctx.lineTo(tx+Math.cos(this.angle+Math.PI/2)*wig*this.r,
               ty+Math.sin(this.angle+Math.PI/2)*wig*this.r);
    ctx.stroke();
    ctx.fillStyle='rgba(230,165,90,0.85)';
    ctx.beginPath();
    ctx.ellipse(this.x,this.y,this.r,this.r*0.55,this.angle,0,Math.PI*2);
    ctx.fill();
    const ex=this.x+Math.cos(this.angle)*this.r*0.55;
    const ey=this.y+Math.sin(this.angle)*this.r*0.55;
    ctx.fillStyle='rgba(20,8,4,0.9)';
    ctx.beginPath();
    ctx.arc(ex-Math.sin(this.angle)*this.r*0.25, ey+Math.cos(this.angle)*this.r*0.25, 0.45*dpr,0,Math.PI*2);
    ctx.fill();
  }
}
let artemia=[];
let artemiaSpawnT=0;
function spawnArtemia(){
  const topY = H*SWIM_BAND.topFrac + 20*dpr;
  const botY = H*WATER_FLOOR_FRAC - 12*dpr;
  let x,y;
  const s=Math.random();
  if(s<0.4){ x=Math.random()*W; y=botY - Math.random()*60*dpr; }
  else if(s<0.7){ x=Math.random()*W; y=topY + Math.random()*80*dpr; }
  else { x=Math.random()<0.5? W*0.05 : W*0.95; y=topY + Math.random()*(botY-topY); }
  artemia.push(new Artemia(x,y));
}
function updateArtemia(dt,t){
  artemiaSpawnT+=dt;
  if(artemia.length<CFG.ARTEMIA_MAX && artemiaSpawnT>CFG.ARTEMIA_SPAWN_DT){
    spawnArtemia(); artemiaSpawnT=0;
  }
  artemia=artemia.filter(a=>!a.eaten);
  for(const a of artemia) a.update(dt,t);
}

/* ============================================================
   NEST
   ============================================================ */
class Nest{
  constructor(x,y){
    this.x=x; this.y=y;
    this.bubbles=[];
    this.eggs=[];
    this.built=false;
    this.hatched=false;
    this.t=0;
    this.done=false;
    this.doneT=0;
  }
  addBubble(){
    const a=Math.random()*Math.PI*2;
    const r=Math.random()*30*dpr;
    this.bubbles.push({
      ox:Math.cos(a)*r, oy:Math.sin(a)*r*0.5,
      r:(2.5+Math.random()*3)*dpr,
      phase:Math.random()*Math.PI*2,
    });
    bubblePop();
  }
  addEgg(){
    this.eggs.push({
      ox:(Math.random()-0.5)*40*dpr,
      oy:8*dpr+Math.random()*6*dpr,
      r:1.6*dpr,
      phase:Math.random()*Math.PI*2,
    });
  }
  update(dt){
    this.t+=dt;
    if(!this.built && this.bubbles.length>=CFG.NEST_BUBBLES){
      this.built=true;
      for(let i=0;i<20;i++) this.addEgg();
    }
  }
  draw(t, alpha){
    alpha = (alpha==null) ? 1 : alpha;
    ctx.save();
    ctx.globalAlpha = alpha;
    for(const b of this.bubbles){
      const bob=Math.sin(t*1.2+b.phase)*1.2*dpr;
      const cx=this.x+b.ox, cy=this.y+b.oy+bob;
      ctx.strokeStyle='rgba(200,230,220,0.55)';
      ctx.lineWidth=0.6*dpr;
      ctx.beginPath(); ctx.arc(cx,cy,b.r,0,Math.PI*2); ctx.stroke();
      ctx.fillStyle='rgba(180,220,210,0.18)';
      ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.4)';
      ctx.beginPath(); ctx.arc(cx-b.r*0.3,cy-b.r*0.3,b.r*0.3,0,Math.PI*2); ctx.fill();
    }
    for(const e of this.eggs){
      const bob=Math.sin(t*1.4+e.phase)*0.6*dpr;
      ctx.fillStyle='rgba(230,220,190,0.75)';
      ctx.beginPath(); ctx.arc(this.x+e.ox, this.y+e.oy+bob, e.r, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
}

/* ============================================================
   FOOD INVITATION — círculo (moneda de 5 pesos), sin texto
   ============================================================ */
const foodCircle = { x:0, y:0, r:0 };
let foodHintMotes=[];
let foodHoverT=0;
function initFoodHint(){
  foodCircle.r = 30*dpr;
  foodCircle.x = W*0.5;
  foodCircle.y = foodCircle.r + 20*dpr;
  foodHintMotes=[];
  for(let i=0;i<16;i++){
    const a=Math.random()*Math.PI*2;
    const rr=Math.random()*foodCircle.r*0.8;
    foodHintMotes.push({
      ox:Math.cos(a)*rr,
      oy:Math.sin(a)*rr,
      r:(0.6+Math.random()*1.1)*dpr,
      speed:0.22+Math.random()*0.35,
      phase:Math.random()*Math.PI*2,
      baseA:0.25+Math.random()*0.35,
    });
  }
}
function drawFoodHint(t, dt, mouse){
  let hovering=false;
  if(mouse){
    const dx=mouse.x-foodCircle.x, dy=mouse.y-foodCircle.y;
    if(Math.hypot(dx,dy) < foodCircle.r*1.35) hovering=true;
  }
  if(hovering) foodHoverT=Math.min(1, foodHoverT+dt*2.4);
  else         foodHoverT=Math.max(0, foodHoverT-dt*1.0);

  const pulse = 1 + Math.sin(t*1.9)*0.07;
  const r = foodCircle.r * pulse;
  const intensity = 0.30 + 0.70*foodHoverT;

  const g=ctx.createRadialGradient(foodCircle.x, foodCircle.y, 0, foodCircle.x, foodCircle.y, r*2.6);
  g.addColorStop(0, `rgba(230,200,110,${0.20*intensity})`);
  g.addColorStop(0.5, `rgba(180,150,70,${0.08*intensity})`);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.arc(foodCircle.x, foodCircle.y, r*2.6, 0, Math.PI*2); ctx.fill();

  ctx.strokeStyle = `rgba(240,215,130,${(0.40 + 0.45*foodHoverT)*(0.75+0.25*Math.sin(t*2.2))})`;
  ctx.lineWidth = 1.2*dpr;
  ctx.beginPath(); ctx.arc(foodCircle.x, foodCircle.y, r, 0, Math.PI*2); ctx.stroke();

  const g2=ctx.createRadialGradient(foodCircle.x, foodCircle.y, 0, foodCircle.x, foodCircle.y, r);
  g2.addColorStop(0, `rgba(255,230,150,${0.08+0.20*foodHoverT})`);
  g2.addColorStop(1, 'rgba(255,230,150,0)');
  ctx.fillStyle=g2;
  ctx.beginPath(); ctx.arc(foodCircle.x, foodCircle.y, r, 0, Math.PI*2); ctx.fill();

  for(const m of foodHintMotes){
    m.phase += dt*1.8;
    m.oy -= m.speed*dpr*60*dt;
    if(m.oy < -foodCircle.r*0.9){
      const a=Math.random()*Math.PI*2;
      const rr=Math.random()*foodCircle.r*0.7;
      m.ox=Math.cos(a)*rr;
      m.oy=foodCircle.r*0.85;
    }
    const dd = Math.hypot(m.ox, m.oy);
    if(dd > foodCircle.r*0.95){ m.ox*=0.9; m.oy*=0.9; }
    const px = foodCircle.x + m.ox;
    const py = foodCircle.y + m.oy;
    const a=m.baseA*(0.55+0.45*Math.sin(m.phase))*(0.5+0.5*foodHoverT+0.2);
    ctx.globalAlpha=Math.min(0.9,a);
    ctx.fillStyle='rgba(240,215,130,1)';
    ctx.beginPath(); ctx.arc(px,py,m.r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
}

  const variant=BIRTH_VARIANTS[nextIndex];
  if(!variant)return null;

  const b=new Betta(parent.sex,{
    isAdult:false,
    isFounder:false,
    variant,
    x:parent.nest.x+(Math.random()-.5)*20*dpr,
    y:parent.nest.y+20*dpr,
    depthPlane:2
  });
  b.opacity=.72;
  babies.push(b);
  createdBettas++;
  if(actx)bubbleSnd(1.5,1.2+Math.random()*.4);
  return b;
}

function allBettas(){ return [betta,...babies]; }
/* ============================================================
   PELLETS — caen dentro de la banda de nado
   ============================================================ */
class Pellet{
  constructor(x,y){
    this.x=x; this.y=y;
    this.vx=(Math.random()-0.5)*0.15;
    this.vy=0.32+Math.random()*0.12;
    this.r=2.6*dpr;
    this.phase=Math.random()*Math.PI*2;
    this.eaten=false;
    this.restT=0;
    this.floorY = H*WATER_FLOOR_FRAC - 8*dpr - 4*this.r;
  }
  update(dt){
    this.y+=this.vy*dpr*60*dt;
    this.x+=Math.sin(this.phase+performance.now()*0.002)*0.4*dpr;
    if(this.y>this.floorY){ this.y=this.floorY; this.vy=0; this.restT+=dt; }
  }
  draw(){
    ctx.fillStyle='rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.arc(this.x,this.y,this.r*1.4,0,Math.PI*2); ctx.fill();
    const g=ctx.createRadialGradient(this.x-this.r*0.3,this.y-this.r*0.3,0,this.x,this.y,this.r);
    g.addColorStop(0,'#b89460'); g.addColorStop(0.5,'#8a6638'); g.addColorStop(1,'#4a3518');
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(this.x,this.y,this.r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(255,240,200,0.5)';
    ctx.beginPath(); ctx.arc(this.x-this.r*0.3,this.y-this.r*0.3,this.r*0.35,0,Math.PI*2); ctx.fill();
  }
}
let pellets=[];

/* ============================================================
   INSTANCIAS
   ============================================================ */
let betta;
let mouse=null;

function start(){
  resize();
  initFoodHint();
  const sex=Math.random()<.5?'male':'female';
  betta=new Betta(sex,{variant:'original',isFounder:true,isAdult:true,depthPlane:2});
}

start();
addEventListener('resize',()=>{resize();initFoodHint();});

/* ============================================================
   LOOP — 5 planos reales
   ============================================================ */
let last=performance.now();
function loop(now){
  const dt=Math.min((now-last)/1000,.033);last=now;const t=now/1000;

  readMic();

  ctx.drawImage(swampCanvas,0,0);

  drawPlantsSet(t,plants,.62);
  drawPlantsSet(t,plantsFg,.16);
  drawMotes(dt);

  for(const n of nests){
    if(n.done)n.doneT+=dt;
    const a=n.done?Math.max(0,1-n.doneT/15):1;
    n.draw(t,a);
  }
  nests=nests.filter(n=>!(n.done&&n.doneT>=15));

  updateArtemia(dt,t);
  for(const a of artemia)a.draw(t);

  for(const p of pellets)if(!p.eaten){p.update(dt);p.draw();}
  pellets=pellets.filter(p=>!p.eaten&&p.restT<12);

  const fishes=allBettas();
  for(const f of fishes)f.update(dt);

  fishes.sort((a,b)=>b.depthZ-a.depthZ);
  for(const f of fishes)f.draw();

  drawPlantsSet(t,plants,.30);
  drawPlantsSet(t,plantsFg,1);

  drawFoodHint(t,dt,mouse);

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ============================================================
   EVENTOS
   ============================================================ */
canvas.addEventListener('mousemove', e=>{
  const r=canvas.getBoundingClientRect();
  mouse={x:(e.clientX-r.left)*dpr, y:(e.clientY-r.top)*dpr};
});
canvas.addEventListener('mouseleave', ()=>{ mouse=null; });

canvas.addEventListener('click', ()=>{ initAudio(); });

canvas.addEventListener('dblclick', e=>{
  const r=canvas.getBoundingClientRect();
  const x=(e.clientX-r.left)*dpr, y=(e.clientY-r.top)*dpr;
  const dx=x-foodCircle.x, dy=y-foodCircle.y;
  if(Math.hypot(dx,dy) < foodCircle.r*1.4){
    pellets.push(new Pellet(foodCircle.x, foodCircle.y - 4*dpr));
    for(let i=0;i<3;i++) setTimeout(()=>bubbleSnd(0.7, 1.0+Math.random()*0.4), i*60);
  }
});

let lastTapT=0, lastTapX=0, lastTapY=0;
canvas.addEventListener('touchstart', e=>{
  initAudio();
  const r=canvas.getBoundingClientRect();
  const x=(e.touches[0].clientX-r.left)*dpr, y=(e.touches[0].clientY-r.top)*dpr;
  const nowT=performance.now();
  const near = Math.hypot(x-lastTapX, y-lastTapY) < 60*dpr;
  if(nowT-lastTapT<350 && near){
    const dx=x-foodCircle.x, dy=y-foodCircle.y;
    if(Math.hypot(dx,dy) < foodCircle.r*1.6){
      pellets.push(new Pellet(foodCircle.x, foodCircle.y - 4*dpr));
      for(let i=0;i<3;i++) setTimeout(()=>bubbleSnd(0.7,1.0+Math.random()*0.4),i*60);
    }
    lastTapT=0;
  } else {
    lastTapT=nowT; lastTapX=x; lastTapY=y;
  }
}, {passive:true});
</script>
